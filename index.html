<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Simulation Web App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        /* 9:16 Vertical Screen TikTok/Reels Style */
        #canvasContainer {
            position: relative;
            width: 100%;
            max-width: 450px;
            height: 100vh;
            max-height: 800px;
            background-color: #0b7300; /* Football pitch green */
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-radius: 12px;
            overflow: hidden;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
</head>
<body>

<div id="canvasContainer">
    <canvas id="gameCanvas"></canvas>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // -------------------------------------------------------------
    // ⭐ စိတ်ကြိုက်ပြင်ဆင်နိုင်သော အပိုင်း (IMAGE URL များ ထည့်ရန်)
    // -------------------------------------------------------------
    // မိမိ Upload လုပ်မည့် ပုံလမ်းကြောင်း (သို့) အမည်များကို ဒီနေရာမှာ လဲပေးပါ
    const IRAQ_IMAGE_URL = 'https://picsum.photos/id/237/100/100';      // ဥပမာ ပုံ
    const VENEZUELA_IMAGE_URL = 'https://picsum.photos/id/1025/100/100'; // ဥပမာ ပုံ
    // -------------------------------------------------------------

    // Canvas Size ကို သတ်မှတ်ခြင်း (Internal Resolution)
    const WIDTH = 450;
    const HEIGHT = 800;
    canvas.width = WIDTH;
    canvas.height = HEIGHT;

    // ဂိမ်းဆိုင်ရာ ကိန်းရှင်များ
    let score = { iraq: 0, venezuela: 0 };
    const center = { x: WIDTH / 2, y: HEIGHT / 2 - 20 };
    const fieldRadius = 140; // အလယ်အဝိုင်းကွင်း၏ အချင်းဝက်

    // ဂိုးပေါက်ဆိုင်ရာ Variables
    let goalAngle = 0; // ဂိုးပေါက်စတင်မည့် ထောင့်
    const goalSpeed = 0.012; // ဂိုးပေါက် လည်ပတ်မည့် အရှိန်
    const goalWidthAngle = 0.4; // ဂိုးပေါက်အကျယ် (Radian ဖြင့်)

    // ပုံများကို Load လုပ်ခြင်း
    const imgIraq = new Image();
    imgIraq.src = IRAQ_IMAGE_URL;
    const imgVenezuela = new Image();
    imgVenezuela.src = VENEZUELA_IMAGE_URL;

    // ဘောလုံး (သို့) နိုင်ငံအလံများ၏ သတ်မှတ်ချက်
    const balls = [
        {
            name: 'Iraq',
            x: center.x - 40,
            y: center.y - 40,
            vx: 3,
            vy: 4,
            radius: 22,
            img: imgIraq,
            isGoalOut: false
        },
        {
            name: 'Venezuela',
            x: center.x + 40,
            y: center.y + 40,
            vx: -4,
            vy: 3,
            radius: 22,
            img: imgVenezuela,
            isGoalOut: false
        }
    ];

    // ဘောလုံးကို ကွင်းလယ်သို့ ပြန်ပို့ရန် (ဂိုးဝင်ပြီးနောက်)
    function resetBall(ball) {
        ball.x = center.x + (Math.random() * 40 - 20);
        ball.y = center.y + (Math.random() * 40 - 20);
        // အရှိန်အသစ် ပြန်ပေးခြင်း
        ball.vx = (Math.random() > 0.5 ? 1 : -1) * (3 + Math.random() * 2);
        ball.vy = (Math.random() > 0.5 ? 1 : -1) * (3 + Math.random() * 2);
        ball.isGoalOut = false;
    }

    // အဓိက Game Loop အလုပ်လုပ်ပုံ
    function update() {
        // 1. ဂိုးပေါက်ကို လည်ပတ်စေခြင်း
        goalAngle += goalSpeed;
        if (goalAngle > Math.PI * 2) goalAngle -= Math.PI * 2;

        balls.forEach(ball => {
            // ဂိုးဝင်ပြီး အပြင်ထွက်သွားချိန်ဆိုလျှင် အဝိုင်းဘောင်နှင့် ထိတွေ့မှု မတွက်တော့ပါ
            if (ball.isGoalOut) {
                ball.x += ball.vx;
                ball.y += ball.vy;

                // ကန်バス အပြင်ဘက် လုံးဝရောက်သွားရင် Reset လုပ်မယ်
                if (ball.x < -50 || ball.x > WIDTH + 50 || ball.y < -50 || ball.y > HEIGHT + 50) {
                    resetBall(ball);
                }
                return;
            }

            // ဘောလုံး ရွေ့လျားမှု ကိန်းဂဏန်းများ ပြောင်းလဲခြင်း
            ball.x += ball.vx;
            ball.y += ball.vy;

            // အလယ်ဗဟိုကနေ ဘောလုံးဆီသို့ အကွာအဝေးကို တွက်ချက်ခြင်း
            let dx = ball.x - center.x;
            let dy = ball.y - center.y;
            let distance = Math.sqrt(dx * dx + dy * dy);

            // အဝိုင်းကွင်းဘောင်နားသို့ ရောက်ရှိခြင်း ရှိ/မရှိ စစ်ဆေးခြင်း
            if (distance + ball.radius >= fieldRadius) {
                
                // ဘောလုံးရှိနေသည့် လက်ရှိ ထောင့် (Angle) ကို ရှာခြင်း
                let ballAngle = Math.atan2(dy, dx);
                if (ballAngle < 0) ballAngle += Math.PI * 2;

                // ဂိုးပေါက်တည်နေရာ Angle အပိုင်းအခြားအတွင်း ရောက်မရောက် စစ်ဆေးခြင်း
                let angleDiff = Math.abs(ballAngle - goalAngle);
                if (angleDiff > Math.PI) angleDiff = Math.PI * 2 - angleDiff;

                if (angleDiff < goalWidthAngle / 2) {
                    // ⭐ ဂိုးဝင်သွားပြီ! (ဂိုးပေါက်ထဲသို့ ဆက်လက်ထွက်ခွာခွင့်ပြုသည်)
                    ball.isGoalOut = true;
                    if (ball.name === 'Iraq') score.iraq++;
                    else score.venezuela++;
                } else {
                    // ဂိုးပေါက် မဟုတ်လျှင် ဘောင်နှင့်တိုက်ပြီး လမ်းကြောင်းပြောင်း (Bounce ပြန်ကန်) စေမည်
                    let nx = dx / distance;
                    let ny = dy / distance;

                    // ဘောလုံးကို ဘောင်ပေါ်သို့ တိကျစွာ ပြန်တင်ပေးခြင်း
                    ball.x = center.x + nx * (fieldRadius - ball.radius);
                    ball.y = center.y + ny * (fieldRadius - ball.radius);

                    // Reflect velocity vector
                    let dotProduct = ball.vx * nx + ball.vy * ny;
                    ball.vx = ball.vx - 2 * dotProduct * nx;
                    ball.vy = ball.vy - 2 * dotProduct * ny;
                }
            }
        });

        // ဘောလုံးအချင်းချင်း တိုက်မိခြင်းကို တွက်ချက်ခြင်း
        for (let i = 0; i < balls.length; i++) {
            for (let j = i + 1; j < balls.length; j++) {
                let b1 = balls[i];
                let b2 = balls[j];
                if (b1.isGoalOut || b2.isGoalOut) continue;

                let dx = b2.x - b1.x;
                let dy = b2.y - b1.y;
                let dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < b1.radius + b2.radius) {
                    // အချင်းချင်း တိုက်မိ၍ ပြန်ကန်ထွက်ခြင်း
                    let overlap = (b1.radius + b2.radius) - dist;
                    let nx = dx / dist;
                    let ny = dy / dist;

                    b1.x -= nx * overlap / 2;
                    b1.y -= ny * overlap / 2;
                    b2.x += nx * overlap / 2;
                    b2.y += ny * overlap / 2;

                    // ရိုးရှင်းသော အရှိန်လဲလှယ်မှု (Velocity Swap)
                    let kx = b1.vx - b2.vx;
                    let ky = b1.vy - b2.vy;
                    let p = nx * kx + ny * ky;

                    b1.vx -= p * nx;
                    b1.vy -= p * ny;
                    b2.vx += p * nx;
                    b2.vy += p * ny;
                }
            }
        }
    }

    // Canvas ပေါ်တွင် ပုံရိပ်များ ဆွဲခြင်း (Drawing)
    function draw() {
        // နောက်ခံမြက်ခင်းပြင်အရောင် ချယ်ခြင်း
        ctx.fillStyle = '#0b7300';
        ctx.fillRect(0, 0, WIDTH, HEIGHT);

        // ကွင်းအပြင်ဘက် အဖြူရောင် လိုင်းများ
        ctx.strokeStyle = 'rgba(255,255,255,0.3)';
        ctx.lineWidth = 5;
        ctx.strokeRect(20, 20, WIDTH - 40, HEIGHT - 40);

        // အလယ်အဝိုင်းကွင်းကြီး ဆွဲခြင်း
        ctx.beginPath();
        ctx.arc(center.x, center.y, fieldRadius, 0, Math.PI * 2);
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 6;
        ctx.stroke();

        // 🥅 လည်ပတ်နေသော ဂိုးပေါက်အား ဆွဲခြင်း
        ctx.save();
        ctx.translate(center.x, center.y);
        ctx.rotate(goalAngle);
        
        // ဂိုးပေါက်ပုံစံ (အဖြူရောင် လေးထောင့်ကွက်ကျား ကွန်ရက်)
        ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 4;
        
        ctx.beginPath();
        // ဂိုးပေါက်ကို အဝိုင်းအပြင်ဘက်သို့ ထိုးထွက်နေသော ပုံစံဆွဲခြင်း
        ctx.arc(0, 0, fieldRadius + 30, -goalWidthAngle/2, goalWidthAngle/2);
        let startX = Math.cos(-goalWidthAngle/2) * fieldRadius;
        let startY = Math.sin(-goalWidthAngle/2) * fieldRadius;
        let endX = Math.cos(goalWidthAngle/2) * fieldRadius;
        let endY = Math.sin(goalWidthAngle/2) * fieldRadius;
        
        ctx.lineTo(endX, endY);
        ctx.arc(0, 0, fieldRadius, goalWidthAngle/2, -goalWidthAngle/2, true);
        ctx.lineTo(startX, startY);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.restore();

        // ⚽ ဘောလုံးများ (သို့) အလံပုံများအား ဆွဲခြင်း
        balls.forEach(ball => {
            ctx.save();
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.clip(); // ပုံကို အဝိုင်းပုံစံ ဖြစ်အောင် ညှပ်ထုတ်ခြင်း
            
            // Image တက်လာရင် ပုံဆွဲမယ်၊ မတက်သေးရင် အရောင်ဝိုင်းပြထားမယ်
            try {
                ctx.drawImage(ball.img, ball.x - ball.radius, ball.y - ball.radius, ball.radius * 2, ball.radius * 2);
            } catch (e) {
                ctx.fillStyle = ball.name === 'Iraq' ? '#ff4d4d' : '#4d94ff';
                ctx.fill();
            }
            
            // ဘောလုံးဘောင်လိုင်း
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.restore();
        });

        // 📊 ရမှတ်ဘုတ် (Scoreboard) ဆွဲခြင်း
        ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
        ctx.fillRect(40, 40, WIDTH - 80, 70);
        ctx.borderRadius = 10;

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 24px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(`Iraq  ${score.iraq} - ${score.venezuela}  Venezuela`, WIDTH / 2, 82);
    }

    // Animation ကို စဉ်ဆက်မပြတ် မောင်းနှင်ပေးမည့် လုပ်ဆောင်ချက်
    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    // စတင်မောင်းနှင်ခြင်း
    loop();
</script>

</body>
</html>

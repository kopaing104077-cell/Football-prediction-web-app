<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Fast Match Simulator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        /* 9:16 Vertical Screen TikTok/Reels Layout */
        #canvasContainer {
            position: relative;
            width: 100%;
            max-width: 450px;
            height: 100vh;
            max-height: 800px;
            background-color: #0b7300; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding-bottom: 20px;
        }
        
        /* Top Scoreboard Container */
        .top-scoreboard {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 25px;
            z-index: 5;
        }
        .score-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }
        .score-flag {
            width: 40px;
            height: 26px;
            background-color: #333;
            border: 1px solid #fff;
            object-fit: cover;
            border-radius: 2px;
        }
        .score-text {
            color: #ffffff;
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
        }
        .timer-text {
            color: #ffffff;
            font-size: 26px;
            margin-top: 5px;
            font-weight: 500;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
        }

        /* Canvas Area */
        canvas {
            width: 100%;
            height: 420px;
            display: block;
        }

        /* 🛠️ Bottom Control Card (ဗီဒီယိုထဲက ပုံစံအတိုင်း) */
        .bottom-card {
            background-color: #000000;
            width: 90%;
            margin: 0 auto;
            border-radius: 18px;
            padding: 15px;
            color: white;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
            z-index: 10;
        }
        .card-title {
            text-align: center;
            font-size: 11px;
            color: #888;
            margin-bottom: 4px;
        }
        .card-main-title {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 12px;
        }
        .teams-setup {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 12px;
        }
        .team-box {
            flex: 1;
            background: #111;
            border: 1px solid #222;
            border-radius: 10px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        .team-box input[type="text"] {
            width: 100%;
            background: #222;
            border: 1px solid #444;
            color: #fff;
            padding: 5px;
            border-radius: 6px;
            text-align: center;
            font-size: 13px;
            font-weight: bold;
        }
        .upload-btn {
            background: #222;
            color: #aaa;
            font-size: 11px;
            padding: 5px 8px;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
            width: 100%;
            border: 1px dashed #555;
        }
        .upload-btn:hover {
            background: #333;
            color: #fff;
        }
        .upload-btn input[type="file"] {
            display: none;
        }
        .start-btn-container {
            width: 100%;
        }
        .start-btn {
            width: 100%;
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 10px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }
        .start-btn:hover {
            background: #e0e0e0;
        }
    </style>
</head>
<body>

<div id="canvasContainer">
    <div class="top-scoreboard">
        <div class="score-row">
            <img id="flagLeft" class="score-flag" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" style="background-color: #4d94ff;">
            <div class="score-text" id="scoreDisplay">0 - 0</div>
            <img id="flagRight" class="score-flag" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" style="background-color: #ff4d4d;">
        </div>
        <div class="timer-text" id="timerDisplay">00:00</div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div class="bottom-card">
        <div class="card-title" id="cardSub">6/10</div>
        <div class="card-main-title" id="cardMain">Tomorrow</div>
        
        <div class="teams-setup">
            <div class="team-box">
                <input type="text" id="t1NameInput" value="Venezuela">
                <label class="upload-btn">
                    📷 Upload Image
                    <input type="file" id="t1File" accept="image/*">
                </label>
            </div>
            <div class="team-box">
                <input type="text" id="t2NameInput" value="Iraq">
                <label class="upload-btn">
                    📷 Upload Image
                    <input type="file" id="t2File" accept="image/*">
                </label>
            </div>
        </div>

        <div class="start-btn-container">
            <button class="start-btn" id="ctrlBtn">START SIMULATION</button>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const WIDTH = 450;
    const HEIGHT = 420; 
    canvas.width = WIDTH;
    canvas.height = HEIGHT;

    const center = { x: WIDTH / 2, y: HEIGHT / 2 };
    const fieldRadius = 145; 

    // Simulation Configs
    let score = { team1: 0, team2: 0 };
    let isSimulating = false;
    
    // ⭐ အချိန်စနစ်မြှင့်တင်ခြင်း (မိနစ် ၉၀ ကို ၇၅ စက္ကန့်အတွင်း အပြီးမောင်းမည်)
    let virtualMinutes = 0;
    let virtualSeconds = 0;
    let lastTimeUpdate = 0;
    const matchDurationInSeconds = 75; // စုစုပေါင်း ၇၅ စက္ကန့် ကြာမြင့်မည်

    let goalAngle = -Math.PI / 3; 
    const goalWidthAngle = 0.45; 

    const balls = [
        { id: 'team1', name: 'Venezuela', x: center.x - 35, y: center.y + 20, vx: -6, vy: 5, radius: 21, img: null, isGoalOut: false, color: '#4d94ff' },
        { id: 'team2', name: 'Iraq', x: center.x + 35, y: center.y - 20, vx: 5.5, vy: -6, radius: 21, img: null, isGoalOut: false, color: '#ff4d4d' }
    ];

    // 🔊 Web Audio API
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playTickSound() {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(550, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.04);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.04);
    }

    function playGoalSound() {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const bufferSize = audioCtx.sampleRate * 1.2;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1;
        }
        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(450, audioCtx.currentTime);
        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.2);
        noise.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);
        noise.start();
    }

    function resetBall(ball) {
        ball.x = center.x + (Math.random() * 30 - 15);
        ball.y = center.y + (Math.random() * 30 - 15);
        // အရှိန်မြှင့်ထားသော Velocity
        ball.vx = (Math.random() > 0.5 ? 1 : -1) * (5 + Math.random() * 3);
        ball.vy = (Math.random() > 0.5 ? 1 : -1) * (5 + Math.random() * 3);
        ball.isGoalOut = false;
    }

    // ⚙️ Logic Update Loop
    function update() {
        if (!isSimulating) return;

        // ⏱️ ၉၀ မိနစ် အမြန်ပြေးစနစ် တွက်ချက်ခြင်း
        let now = Date.now();
        if (now - lastTimeUpdate >= (matchDurationInSeconds * 1000 / 5400)) { 
            virtualSeconds++;
            if (virtualSeconds >= 60) {
                virtualSeconds = 0;
                virtualMinutes++;
            }
            lastTimeUpdate = now;

            // မိနစ် ၉၀ ပြည့်လျှင် ရပ်တန့်မည်
            if (virtualMinutes >= 90) {
                virtualMinutes = 90;
                virtualSeconds = 0;
                isSimulating = false;
                document.getElementById('ctrlBtn').innerText = "MATCH FINISHED";
                document.getElementById('ctrlBtn').style.background = "#555";
                document.getElementById('ctrlBtn').style.color = "#fff";
            }
            
            // DOM သို့ အချိန်လှမ်းပြောင်းခြင်း
            let minsStr = virtualMinutes.toString().padStart(2, '0');
            let secsStr = virtualSeconds.toString().padStart(2, '0');
            document.getElementById('timerDisplay').innerText = `${minsStr}:${secsStr}`;
        }

        balls.forEach(ball => {
            if (ball.isGoalOut) {
                ball.x += ball.vx;
                ball.y += ball.vy;
                if (ball.x < -40 || ball.x > WIDTH + 40 || ball.y < -40 || ball.y > HEIGHT + 40) {
                    resetBall(ball);
                }
                return;
            }

            ball.x += ball.vx;
            ball.y += ball.vy;

            let dx = ball.x - center.x;
            let dy = ball.y - center.y;
            let distance = Math.sqrt(dx * dx + dy * dy);

            if (distance + ball.radius >= fieldRadius) {
                let ballAngle = Math.atan2(dy, dx);
                let angleDiff = Math.abs(ballAngle - goalAngle);
                if (angleDiff > Math.PI) angleDiff = Math.PI * 2 - angleDiff;

                if (angleDiff < goalWidthAngle / 2) {
                    // ⚽ ဂိုးဝင်ပြီ!
                    ball.isGoalOut = true;
                    playGoalSound();
                    if (ball.id === 'team1') score.team1++;
                    else score.team2++;
                    
                    document.getElementById('scoreDisplay').innerText = `${score.team1} - ${score.team2}`;
                } else {
                    // ဘောင်ကန်ထွက်ခြင်း
                    let nx = dx / distance;
                    let ny = dy / distance;

                    ball.x = center.x + nx * (fieldRadius - ball.radius);
                    ball.y = center.y + ny * (fieldRadius - ball.radius);

                    let dotProduct = ball.vx * nx + ball.vy * ny;
                    ball.vx = ball.vx - 2 * dotProduct * nx;
                    ball.vy = ball.vy - 2 * dotProduct * ny;

                    goalAngle = ballAngle; // ဂိုးပေါက် ချက်ချင်းရွှေ့ခြင်း
                    playTickSound();
                }
            }
        });

        // ဘောလုံးအချင်းချင်း တိုက်မိခြင်း
        for (let i = 0; i < balls.length; i++) {
            for (let j = i + 1; j < balls.length; j++) {
                let b1 = balls[i]; let b2 = balls[j];
                if (b1.isGoalOut || b2.isGoalOut) continue;

                let dx = b2.x - b1.x;
                let dy = b2.y - b1.y;
                let dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < b1.radius + b2.radius) {
                    let overlap = (b1.radius + b2.radius) - dist;
                    let nx = dx / dist; let ny = dy / dist;

                    b1.x -= nx * overlap / 2; b1.y -= ny * overlap / 2;
                    b2.x += nx * overlap / 2; b2.y += ny * overlap / 2;

                    let kx = b1.vx - b2.vx; let ky = b1.vy - b2.vy;
                    let p = nx * kx + ny * ky;

                    b1.vx -= p * nx; b1.vy -= p * ny;
                    b2.vx += p * nx; b2.vy += p * ny;
                    playTickSound();
                }
            }
        }
    }

    // 🎨 Graphics Render Loop
    function draw() {
        ctx.clearRect(0, 0, WIDTH, HEIGHT);

        // အလယ်အဝိုင်းကွင်း
        ctx.beginPath();
        ctx.arc(center.x, center.y, fieldRadius, 0, Math.PI * 2);
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 5;
        ctx.stroke();

        // လည်ပတ်/ရွေ့လျားသော ဂိုးပေါက်
        ctx.save();
        ctx.translate(center.x, center.y);
        ctx.rotate(goalAngle);
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 4;
        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        ctx.beginPath();
        ctx.arc(0, 0, fieldRadius + 22, -goalWidthAngle/2, goalWidthAngle/2);
        let endX = Math.cos(goalWidthAngle/2) * fieldRadius;
        let endY = Math.sin(goalWidthAngle/2) * fieldRadius;
        ctx.lineTo(endX, endY);
        ctx.arc(0, 0, fieldRadius, goalWidthAngle/2, -goalWidthAngle/2, true);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.restore();

        // ဘောလုံး/အလံများ ဆွဲခြင်း
        balls.forEach(ball => {
            ctx.save();
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.clip();
            
            if (ball.img) {
                ctx.drawImage(ball.img, ball.x - ball.radius, ball.y - ball.radius, ball.radius * 2, ball.radius * 2);
            } else {
                ctx.fillStyle = ball.color;
                ctx.fill();
            }
            
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.restore();
        });
    }

    function mainLoop() {
        update();
        draw();
        requestAnimationFrame(mainLoop);
    }

    // -------------------------------------------------------------
    // 🕹️ Interactive UI Logic
    // -------------------------------------------------------------
    
    // အမည်များ လိုက်ပြောင်းရန်
    document.getElementById('t1NameInput').addEventListener('input', (e) => {
        balls[0].name = e.target.value || 'Team 1';
    });
    document.getElementById('t2NameInput').addEventListener('input', (e) => {
        balls[1].name = e.target.value || 'Team 2';
    });

    // ပုံတင်စနစ် (Upload Image to Ball & Scoreboard Flag)
    function handleImageUpload(fileInputId, ballIndex, flagImgId) {
        document.getElementById(fileInputId).addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => { 
                        balls[ballIndex].img = img; 
                        document.getElementById(flagImgId).src = event.target.result;
                    };
                };
                reader.readAsDataURL(file);
            }
        });
    }
    handleImageUpload('t1File', 0, 'flagLeft');
    handleImageUpload('t2File', 1, 'flagRight');

    // START SIMULATION ကိုနှိပ်မှ စတင်မည့်စနစ်
    const ctrlBtn = document.getElementById('ctrlBtn');
    ctrlBtn.addEventListener('click', () => {
        if (virtualMinutes >= 90) return; // ပွဲပြီးရင် ထပ်နှိပ်မရပါ
        
        if (audioCtx.state === 'suspended') audioCtx.resume();
        
        isSimulating = !isSimulating;
        if (isSimulating) {
            ctrlBtn.innerText = "PAUSE SIMULATION";
            ctrlBtn.style.background = "#ff4d4d";
            ctrlBtn.style.color = "#fff";
            lastTimeUpdate = Date.now();
        } else {
            ctrlBtn.innerText = "START SIMULATION";
            ctrlBtn.style.background = "#ffffff";
            ctrlBtn.style.color = "#000000";
        }
    });

    // Engine စတင်ပတ်မောင်းနှင်ခြင်း
    mainLoop();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viral Football Prediction Studio</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

:root{
--bg:#060912;
--glass:rgba(255,255,255,.08);
--border:rgba(255,255,255,.12);
--accent:#00e5ff;
--accent2:#7b61ff;
--text:#fff;
}

body{
background:
radial-gradient(circle at top left,#16213e,#060912 60%);
color:white;
overflow-x:hidden;
min-height:100vh;
}

body::before{
content:'';
position:fixed;
inset:0;
background:
linear-gradient(120deg,transparent,rgba(255,255,255,.03),transparent);
animation:bgmove 8s linear infinite;
pointer-events:none;
}

@keyframes bgmove{
0%{transform:translateX(-100%)}
100%{transform:translateX(100%)}
}

.app{
display:grid;
grid-template-columns:330px 1fr 320px;
gap:15px;
padding:15px;
}

.panel{
background:var(--glass);
backdrop-filter:blur(20px);
border:1px solid var(--border);
border-radius:24px;
padding:18px;
height:calc(100vh - 30px);
overflow:auto;
}

.panel h2{
font-size:18px;
margin-bottom:15px;
}

.section{
margin-bottom:20px;
}

label{
font-size:12px;
display:block;
margin-bottom:6px;
opacity:.8;
}

input,select{
width:100%;
padding:12px;
border-radius:12px;
border:none;
outline:none;
background:rgba(255,255,255,.08);
color:white;
margin-bottom:10px;
}

button{
border:none;
cursor:pointer;
padding:12px 14px;
border-radius:12px;
color:white;
font-weight:600;
background:linear-gradient(135deg,var(--accent),var(--accent2));
}

.btn{
width:100%;
margin-top:8px;
}

.preview-wrap{
display:flex;
justify-content:center;
align-items:center;
height:100%;
}

.preview{
width:360px;
height:640px;
border-radius:30px;
overflow:hidden;
position:relative;
background:#000;
border:2px solid rgba(255,255,255,.2);
box-shadow:0 0 40px rgba(0,229,255,.25);
aspect-ratio:9/16;
}

.scene{
position:absolute;
inset:0;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:20px;
opacity:0;
transition:1s;
}

.scene.active{
opacity:1;
}

.stadium{
background:
radial-gradient(circle at center,#18345d,#05070f 70%);
}

.stadium::before{
content:'';
position:absolute;
inset:0;
background:
repeating-linear-gradient(
90deg,
transparent,
transparent 40px,
rgba(255,255,255,.03) 41px
);
}

.light{
position:absolute;
width:200px;
height:200px;
background:radial-gradient(circle,rgba(255,255,255,.4),transparent 70%);
filter:blur(20px);
animation:pulse 3s infinite;
}

@keyframes pulse{
50%{transform:scale(1.4)}
}

.logo-row{
display:flex;
gap:25px;
align-items:center;
justify-content:center;
}

.logo{
width:100px;
height:100px;
border-radius:50%;
object-fit:cover;
background:#111;
border:3px solid rgba(255,255,255,.2);
}

.vs{
font-size:52px;
font-weight:800;
color:#fff;
text-shadow:0 0 20px cyan;
animation:zoom 2s infinite;
}

@keyframes zoom{
50%{transform:scale(1.12)}
}

.team-name{
font-size:22px;
font-weight:700;
}

.probability{
width:100%;
margin:12px 0;
}

.bar{
height:18px;
border-radius:30px;
overflow:hidden;
background:rgba(255,255,255,.1);
}

.fill{
height:100%;
width:0%;
background:linear-gradient(90deg,#00e5ff,#7b61ff);
transition:2s;
}

.big-text{
font-size:42px;
font-weight:800;
text-shadow:0 0 25px cyan;
}

.cta{
font-size:34px;
font-weight:800;
animation:pulse 2s infinite;
}

.timeline{
display:flex;
gap:5px;
margin-top:12px;
}

.time-item{
flex:1;
height:8px;
border-radius:10px;
background:rgba(255,255,255,.12);
}

.time-item.active{
background:cyan;
box-shadow:0 0 15px cyan;
}

.template-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
}

.template{
padding:12px;
text-align:center;
border-radius:12px;
background:rgba(255,255,255,.08);
cursor:pointer;
}

.range{
width:100%;
}

.dropzone{
border:2px dashed rgba(255,255,255,.2);
padding:15px;
border-radius:14px;
text-align:center;
margin-bottom:10px;
}

.progress{
height:10px;
background:rgba(255,255,255,.1);
border-radius:20px;
overflow:hidden;
}

.progress div{
height:100%;
width:0;
background:linear-gradient(90deg,cyan,#7b61ff);
}

.particle{
position:absolute;
width:6px;
height:6px;
background:white;
border-radius:50%;
opacity:.5;
animation:float 8s linear infinite;
}

@keyframes float{
from{
transform:translateY(100%) scale(.5);
opacity:0;
}
to{
transform:translateY(-120vh) scale(1.2);
opacity:1;
}
}

.badge{
padding:8px 14px;
border-radius:50px;
background:linear-gradient(90deg,#00e5ff,#7b61ff);
font-weight:700;
margin-top:10px;
}

.thumbCanvas{
width:100%;
border-radius:14px;
background:#000;
}

@media(max-width:1200px){
.app{
grid-template-columns:1fr;
}
.panel{
height:auto;
}
}
</style>
</head>

<body>

<div class="app">

<!-- LEFT PANEL -->
<div class="panel">

<h2><i class="fa-solid fa-futbol"></i> Match Setup</h2>

<div class="section">
<label>Team A Name</label>
<input id="teamAName" value="Real Madrid">

<label>Team B Name</label>
<input id="teamBName" value="Manchester City">

<div class="dropzone">
<input type="file" id="logoA" accept="image/*">
</div>

<div class="dropzone">
<input type="file" id="logoB" accept="image/*">
</div>
</div>

<div class="section">
<label>Prediction Result</label>
<select id="predictionResult">
<option>Team A Win</option>
<option>Team B Win</option>
<option>Draw</option>
</select>

<label>Prediction Style</label>
<select id="predictionStyle">
<option>Expert Prediction</option>
<option>AI Prediction</option>
<option>Super Computer Prediction</option>
<option>Fan Prediction</option>
</select>

<button class="btn" id="autoPrediction">
<i class="fa-solid fa-robot"></i>
 AI Auto Prediction
</button>
</div>

<div class="section">
<h2>Sound Controls</h2>

<label>Crowd</label>
<input type="range" class="range">

<label>Stadium</label>
<input type="range" class="range">

<label>Drum</label>
<input type="range" class="range">

<label>Goal</label>
<input type="range" class="range">
</div>

<div class="section">
<h2>Scene Duration</h2>
<input type="range" id="duration" min="2" max="10" value="4">
</div>

</div>

<!-- CENTER -->
<div class="panel">

<div class="preview-wrap">

<div class="preview" id="preview">

<div class="light"></div>

<div class="scene active stadium" id="scene1">
<div class="logo-row">
<img class="logo" id="logoPreviewA">
<img class="logo" id="logoPreviewB">
</div>
<h2 id="title1">Match Prediction</h2>
</div>

<div class="scene" id="scene2">
<div class="team-name" id="scene2A">Team A</div>
<div class="vs">VS</div>
<div class="team-name" id="scene2B">Team B</div>
</div>

<div class="scene" id="scene3">

<div class="probability">
<div id="teamALabel">Team A 60%</div>
<div class="bar"><div class="fill" id="fillA"></div></div>
</div>

<div class="probability">
<div id="drawLabel">Draw 20%</div>
<div class="bar"><div class="fill" id="fillD"></div></div>
</div>

<div class="probability">
<div id="teamBLabel">Team B 20%</div>
<div class="bar"><div class="fill" id="fillB"></div></div>
</div>

</div>

<div class="scene" id="scene4">
<div class="big-text" id="finalPrediction">AI Predicts</div>
<div class="badge" id="styleBadge">AI Prediction</div>
</div>

<div class="scene" id="scene5">
<div class="cta">COMMENT YOUR PREDICTION</div>
</div>

</div>

</div>

<div class="timeline">
<div class="time-item active"></div>
<div class="time-item"></div>
<div class="time-item"></div>
<div class="time-item"></div>
<div class="time-item"></div>
</div>

<div style="margin-top:15px;">
<button id="playBtn">▶ Auto Play</button>
<button id="fullscreenBtn">⛶ Fullscreen</button>
</div>

<div style="margin-top:15px;" class="progress">
<div id="progressBar"></div>
</div>

</div>

<!-- RIGHT PANEL -->
<div class="panel">

<h2>Templates</h2>

<div class="template-grid">

<div class="template" data-theme="ucl">Champions</div>
<div class="template" data-theme="world">World Cup</div>
<div class="template" data-theme="prem">Premier</div>
<div class="template" data-theme="ai">AI</div>
<div class="template" data-theme="neon">Cyber</div>

</div>

<h2 style="margin-top:20px;">Thumbnail</h2>

<canvas id="thumb" width="1080" height="1920" class="thumbCanvas"></canvas>

<button class="btn" id="thumbBtn">
PNG Thumbnail
</button>

<button class="btn" id="predictionImageBtn">
Prediction Image
</button>

<button class="btn" id="saveBtn">
Save JSON Project
</button>

<input type="file" id="loadFile">

</div>

</div>

<script>

// ===============================
// GLOBAL STATE
// ===============================

let probabilities = {
a:60,
d:20,
b:20
};

let currentScene = 0;
let scenes = [];
let autoplay;

// ===============================
// ELEMENTS
// ===============================

const teamAName = document.getElementById("teamAName");
const teamBName = document.getElementById("teamBName");

const logoA = document.getElementById("logoA");
const logoB = document.getElementById("logoB");

const logoPreviewA = document.getElementById("logoPreviewA");
const logoPreviewB = document.getElementById("logoPreviewB");

const thumbCanvas = document.getElementById("thumb");
const ctx = thumbCanvas.getContext("2d");

// ===============================
// LOGO UPLOAD
// ===============================

function loadImage(input,target){

input.addEventListener("change",e=>{

const file=e.target.files[0];
if(!file) return;

const reader=new FileReader();

reader.onload=function(ev){
target.src=ev.target.result;
generateThumbnail();
};

reader.readAsDataURL(file);

});

}

loadImage(logoA,logoPreviewA);
loadImage(logoB,logoPreviewB);

// ===============================
// LIVE TEAM UPDATE
// ===============================

function updateNames(){

document.getElementById("scene2A").innerText=teamAName.value;
document.getElementById("scene2B").innerText=teamBName.value;

generateThumbnail();

}

teamAName.addEventListener("input",updateNames);
teamBName.addEventListener("input",updateNames);

// ===============================
// AUTO PREDICTION
// ===============================

function autoPrediction(){

let a=Math.floor(Math.random()*26)+45;
let d=Math.floor(Math.random()*21)+10;
let b=100-a-d;

if(b<10){
b=10;
a=100-b-d;
}

probabilities={a,d,b};

updateProbabilityUI();

}

document.getElementById("autoPrediction").onclick=autoPrediction;

// ===============================
// PROBABILITY UI
// ===============================

function updateProbabilityUI(){

teamALabel.innerText=`${teamAName.value} ${probabilities.a}%`;
drawLabel.innerText=`Draw ${probabilities.d}%`;
teamBLabel.innerText=`${teamBName.value} ${probabilities.b}%`;

fillA.style.width=probabilities.a+"%";
fillD.style.width=probabilities.d+"%";
fillB.style.width=probabilities.b+"%";

let result=document.getElementById("predictionResult").value;

document.getElementById("finalPrediction").innerText=result;

generateThumbnail();

}

// ===============================
// SCENES
// ===============================

scenes=[
scene1,
scene2,
scene3,
scene4,
scene5
];

function showScene(index){

scenes.forEach(s=>s.classList.remove("active"));
scenes[index].classList.add("active");

document.querySelectorAll(".time-item").forEach(x=>x.classList.remove("active"));
document.querySelectorAll(".time-item")[index].classList.add("active");

currentScene=index;

}

// ===============================
// AUTOPLAY
// ===============================

document.getElementById("playBtn").onclick=function(){

clearInterval(autoplay);

let duration=Number(document.getElementById("duration").value)*1000;

currentScene=0;
showScene(0);

let progress=0;

autoplay=setInterval(()=>{

progress++;
showScene(progress%5);

document.getElementById("progressBar").style.width=((progress%5)+1)*20+"%";

},duration);

};

// ===============================
// FULLSCREEN
// ===============================

document.getElementById("fullscreenBtn").onclick=()=>{
document.getElementById("preview").requestFullscreen();
};

// ===============================
// TEMPLATES
// ===============================

document.querySelectorAll(".template").forEach(t=>{

t.onclick=()=>{

let mode=t.dataset.theme;

const preview=document.getElementById("preview");

if(mode==="ucl"){
preview.style.background="linear-gradient(180deg,#001b44,#000)";
}

if(mode==="world"){
preview.style.background="linear-gradient(180deg,#4b0000,#000)";
}

if(mode==="prem"){
preview.style.background="linear-gradient(180deg,#31004b,#000)";
}

if(mode==="ai"){
preview.style.background="linear-gradient(180deg,#001f2f,#000)";
}

if(mode==="neon"){
preview.style.background="linear-gradient(180deg,#001122,#0a0018)";
}

};

});

// ===============================
// THUMBNAIL GENERATOR
// ===============================

function generateThumbnail(){

ctx.clearRect(0,0,1080,1920);

let g=ctx.createLinearGradient(0,0,1080,1920);
g.addColorStop(0,"#02152d");
g.addColorStop(1,"#000");

ctx.fillStyle=g;
ctx.fillRect(0,0,1080,1920);

ctx.fillStyle="white";
ctx.font="bold 120px Poppins";
ctx.fillText("VS",470,650);

ctx.font="bold 80px Poppins";
ctx.fillText(teamAName.value,80,1200);
ctx.fillText(teamBName.value,80,1320);

ctx.fillStyle="#00e5ff";
ctx.fillRect(80,1400,500,120);

ctx.fillStyle="#000";
ctx.font="bold 70px Poppins";
ctx.fillText(probabilities.a+"%",250,1480);

if(logoPreviewA.src){
let imgA=new Image();
imgA.src=logoPreviewA.src;
imgA.onload=()=>ctx.drawImage(imgA,100,300,280,280);
}

if(logoPreviewB.src){
let imgB=new Image();
imgB.src=logoPreviewB.src;
imgB.onload=()=>ctx.drawImage(imgB,700,300,280,280);
}

}

// ===============================
// EXPORT PNG
// ===============================

document.getElementById("thumbBtn").onclick=function(){

generateThumbnail();

let a=document.createElement("a");
a.href=thumbCanvas.toDataURL("image/png");
a.download="thumbnail.png";
a.click();

};

document.getElementById("predictionImageBtn").onclick=function(){

let a=document.createElement("a");
a.href=thumbCanvas.toDataURL("image/png");
a.download="prediction-image.png";
a.click();

};

// ===============================
// SAVE PROJECT
// ===============================

document.getElementById("saveBtn").onclick=function(){

const data={
teamA:teamAName.value,
teamB:teamBName.value,
prediction:document.getElementById("predictionResult").value,
style:document.getElementById("predictionStyle").value,
probabilities
};

const blob=new Blob(
[JSON.stringify(data,null,2)],
{type:"application/json"}
);

const a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download="football-project.json";
a.click();

};

// ===============================
// LOAD PROJECT
// ===============================

document.getElementById("loadFile").addEventListener("change",e=>{

const file=e.target.files[0];

if(!file) return;

const reader=new FileReader();

reader.onload=function(){

const data=JSON.parse(reader.result);

teamAName.value=data.teamA;
teamBName.value=data.teamB;

document.getElementById("predictionResult").value=data.prediction;
document.getElementById("predictionStyle").value=data.style;

probabilities=data.probabilities;

updateNames();
updateProbabilityUI();

};

reader.readAsText(file);

});

// ===============================
// STYLE UPDATE
// ===============================

document.getElementById("predictionStyle").addEventListener("change",e=>{
document.getElementById("styleBadge").innerText=e.target.value;
});

document.getElementById("predictionResult").addEventListener("change",updateProbabilityUI);

// ===============================
// PARTICLES
// ===============================

const preview=document.getElementById("preview");

for(let i=0;i<40;i++){

const p=document.createElement("div");
p.className="particle";

p.style.left=Math.random()*100+"%";
p.style.animationDelay=Math.random()*8+"s";

preview.appendChild(p);

}

// ===============================
// INIT
// ===============================

updateNames();
updateProbabilityUI();
generateThumbnail();

</script>

</body>
</html>

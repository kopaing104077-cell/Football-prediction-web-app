<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Supercomputer Football Predictor Pro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #050814;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }
        /* 9:16 Vertical Video Frame (TikTok/Reels Optimized) */
        #viewport {
            position: relative;
            width: 100%;
            max-width: 450px;
            height: 100vh;
            max-height: 800px;
            background: radial-gradient(circle at center, #0a1128 0%, #02040a 100%);
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding-bottom: 20px;
            border: 1px solid #1e293b;
        }
        
        /* Premium Sci-Fi Scoreboard */
        .top-scoreboard {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 35px;
            z-index: 5;
        }
        .ai-badge {
            font-size: 10px;
            color: #00ffcc;
            background: rgba(0, 255, 204, 0.1);
            padding: 2px 10px;
            border-radius: 10px;
            border: 1px solid rgba(0, 255, 204, 0.3);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 8px;
            font-weight: bold;
        }
        .score-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            background: rgba(15, 23, 42, 0.6);
            padding: 10px 25px;
            border-radius: 40px;
            border: 1px solid rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
        }
        .score-flag {
            width: 42px;
            height: 28px;
            background-color: #1e293b;
            border: 2px solid #ffffff;
            object-fit: cover;
            border-radius: 4px;
            box-shadow: 0 0 10px rgba(255,255,255,0.2);
        }
        .score-text {
            color: #ffffff;
            font-size: 36px;
            font-weight: 900;
            font-family: 'Courier New', Courier, monospace;
            text-shadow: 0 0 15px rgba(255,255,255,0.5);
        }
        .timer-text {
            color: #00ffcc;
            font-size: 26px;
            margin-top: 10px;
            font-weight: bold;
            font-family: monospace;
            background: rgba(0, 255, 204, 0.05);
            padding: 4px 16px;
            border-radius: 8px;
            border: 1px solid rgba(0, 255, 204, 0.1);
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
        }

        /* Physics Simulation Studio */
        canvas {
            width: 100%;
            height: 380px;
            display: block;
        }

        /* 🛠️ Modern Sci-Fi Control Dashboard */
        .bottom-card {
            background: rgba(10, 15, 30, 0.9);
            width: 92%;
            margin: 0 auto;
            border-radius: 24px;
            padding: 20px;
            color: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            border: 1px solid rgba(0, 255, 204, 0.1);
            backdrop-filter: blur(10px);
            z-index: 10;
        }
        .card-main-title {
            text-align: center;
            font-size: 18px;
            font-weight: 800;
            margin-bottom: 15px;
            color: #ffffff;
            letter-spacing: 1px;
        }
        .teams-setup {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 15px;
        }
        .team-box {
            flex: 1;
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 14px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .team-box input[type="text"] {
            width: 100%;
            background: #0f172a;
            border: 1px solid #334155;
            color: #fff;
            padding: 8px;
            border-radius: 8px;
            text-align: center;
            font-size: 13px;
            font-weight: bold;
            outline: none;
        }
        .team-box input[type="text"]:focus {
            border-color: #00ffcc;
        }
        .upload-btn {
            background: rgba(0, 255, 204, 0.1);
            color: #00ffcc;
            font-size: 11px;
            font-weight: bold;
            padding: 7px 10px;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            width: 100%;
            border: 1px dashed rgba(0, 255, 204, 0.4);
            transition: 0.2s;
        }
        .upload-btn:hover {
            background: #00ffcc;
            color: #000;
        }
        .upload-btn input[type="file"] {
            display: none;
        }
        .start-btn {
            width: 100%;
            background: #00ffcc;
            color: #050814;
            border: none;
            padding: 14px;
            border-radius: 30px;
            font-weight: 800;
            font-size: 15px;
            cursor: pointer;
            letter-spacing: 1px;
            text-transform: uppercase;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.3);
            transition: 0.3s;
        }
        .start-btn:hover {
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.6);
            transform: scale(1.02);
        }
    </style>
</head>
<body>

<div id="viewport">
    <div class="top-scoreboard">
        <div class="ai-badge" id="aiStatus">Supercomputer Predictive Engine</div>
        <div class="score-row">
            <img id="flagLeft" class="score-flag" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" style="background-color: #3b82f6;">
            <div class="score-text" id="scoreDisplay">0 - 0</div>
            <img id="flagRight" class="score-flag" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" style="background-color: #ef4444;">
        </div>
        <div class="timer-text" id="timerDisplay">00:00</div>
    </div>

    <canvas id="predictionCanvas"></canvas>

    <div class="bottom-card">
        <div class="card-main-title" id="cardMain">MATCH SETUP</div>
        
        <div class="teams-setup">
            <div class="team-box">
                <input type="text" id="t1Name" value="TEAM A">
                <label class="upload-btn">
                    📷 UPLOAD LOGO
                    <input type="file" id="t1File" accept="image/*">
                </label>
            </div>
            <div class="team-box">
                <input type="text" id="t2Name" value="TEAM B">
                <label class="upload-btn">
                    📷 UPLOAD LOGO
                    <input type="file" id="t2File" accept="image/*">
                </label>
            </div>
        </div>

        <button class="start-btn" id="startRecordBtn">Start & Record 1080p Video</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('predictionCanvas');
    const ctx = canvas.getContext('2d');

    // ⭐ High Definition Internal Resolution (1080p Export Optimized)
    const WIDTH = 1080;
    const HEIGHT = 912; 
    canvas.width = WIDTH;
    canvas.height = HEIGHT;

    const center = { x: WIDTH / 2, y: HEIGHT / 2 };
    const fieldRadius = 330; // 1080p ကန်ဗတ်စ်အတွက် ကွင်းအရွယ်အစားကို ချဲ့ထားသည်

    let score = { team1: 0, team2: 0 };
    let isSimulating = false;
    let mediaRecorder;
    let recordedChunks = [];
    
    // ⭐ စက္ကန့် ၃၀ အမြန်ပြေးစနစ် တွက်ချက်ခြင်း
    let virtualMinutes = 0;
    let virtualSeconds = 0;
    let lastTimeUpdate = 0;
    const matchDurationInSeconds = 30; // စက္ကန့် ၃၀ ကွက်တိ

    // ⭐ လက်တွေ့ကျကျ ဝင်ခဲအောင် ကျဉ်းမြောင်းထားသော ဂိုးပေါက်စနစ်
    let goalAngle = -Math.PI / 2; 
    const goalWidthAngle = 0.22; // အလွန်ကျဉ်းမြောင်းသော ဂိုးပေါက်

    const balls = [
        { id: 'team1', name: 'TEAM A', x: center.x - 90, y: center.y + 40, vx: -12, vy: 14, radius: 48, img: null, isGoalOut: false, color: '#3b82f6' },
        { id: 'team2', name: 'TEAM B', x: center.x + 90, y: center.y - 40, vx: 14, vy: -12, radius: 48, img: null, isGoalOut: false, color: '#ef4444' }
    ];

    // 🔊 High Quality Audio Context
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playTickSound() {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(380, audioCtx.currentTime); // ပိုလေးနက်ပြီး အကြည်ခံသောအသံ
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.05);
    }

    function playGoalSound() {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const bufferSize = audioCtx.sampleRate * 2.0;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1;
        }
        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(300, audioCtx.currentTime);
        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 2.0);
        noise.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);
        noise.start();
    }

    function resetBall(ball) {
        ball.x = center.x + (Math.random() * 60 - 30);
        ball.y = center.y + (Math.random() * 60 - 30);
        ball.vx = (Math.random() > 0.5 ? 1 : -1) * (12 + Math.random() * 6);
        ball.vy = (Math.random() > 0.5 ? 1 : -1) * (12 + Math.random() * 6);
        ball.isGoalOut = false;
    }

    // ⚙️ Simulation Engine Update
    function update() {
        if (!isSimulating) return;

        let now = Date.now();
        if (now - lastTimeUpdate >= (matchDurationInSeconds * 1000 / 5400)) { 
            virtualSeconds++;
            if (virtualSeconds >= 60) {
                virtualSeconds = 0;
                virtualMinutes++;
            }
            lastTimeUpdate = now;

            if (virtualMinutes >= 90) {
                virtualMinutes = 90;
                virtualSeconds = 0;
                isSimulating = false;
                stopRecordingAndDownload();
            }
            
            document.getElementById('timerDisplay').innerText = `${virtualMinutes.toString().padStart(2, '0')}:${virtualSeconds.toString().padStart(2, '0')}`;
        }

        balls.forEach(ball => {
            if (ball.isGoalOut) {
                ball.x += ball.vx;
                ball.y += ball.vy;
                if (ball.x < -100 || ball.x > WIDTH + 100 || ball.y < -100 || ball.y > HEIGHT + 100) {
                    resetBall(ball);
                }
                return;
            }

            ball.x += ball.vx;
            ball.y += ball.vy;

            // ⭐ Friction (ပွတ်တိုက်မှုအဟုန်ထည့်ပြီး အရှိန်ထိန်းခြင်း)
            ball.vx *= 0.999;
            ball.vy *= 0.999;

            let dx = ball.x - center.x;
            let dy = ball.y - center.y;
            let distance = Math.sqrt(dx * dx + dy * dy);

            if (distance + ball.radius >= fieldRadius) {
                let ballAngle = Math.atan2(dy, dx);
                let angleDiff = Math.abs(ballAngle - goalAngle);
                if (angleDiff > Math.PI) angleDiff = Math.PI * 2 - angleDiff;

                if (angleDiff < goalWidthAngle / 2) {
                    ball.isGoalOut = true;
                    playGoalSound();
                    if (ball.id === 'team1') score.team1++;
                    else score.team2++;
                    document.getElementById('scoreDisplay').innerText = `${score.team1} - ${score.team2}`;
                } else {
                    let nx = dx / distance;
                    let ny = dy / distance;

                    ball.x = center.x + nx * (fieldRadius - ball.radius);
                    ball.y = center.y + ny * (fieldRadius - ball.radius);

                    let dotProduct = ball.vx * nx + ball.vy * ny;
                    
                    // Chaos Theory Vector
                    let chaos = (Math.random() - 0.5) * 0.8;
                    ball.vx = (ball.vx - 2 * dotProduct * nx) + chaos;
                    ball.vy = (ball.vy - 2 * dotProduct * ny) + chaos;

                    // Speed Constraints
                    let speed = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);
                    if (speed > 22) { ball.vx *= (20/speed); ball.vy *= (20/speed); }
                    if (speed < 12) { ball.vx *= (14/speed); ball.vy *= (14/speed); }

                    goalAngle = ballAngle;
                    playTickSound();
                }
            }
        });

        // Ball vs Ball Collision
        for (let i = 0; i < balls.length; i++) {
            for (let j = i + 1; j < balls.length; j++) {
                let b1 = balls[i]; let b2 = balls[j];
                if (b1.isGoalOut || b2.isGoalOut) continue;

                let dx = b2.x - b1.x;
                let dy = b2.y - b1.y;
                let dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < b1.radius + b2.radius) {
                    let overlap = (b1.radius + b2.radius) - dist;
                    let nx = dx / dist; let ny = dy / dist;

                    b1.x -= nx * overlap / 2; b1.y -= ny * overlap / 2;
                    b2.x += nx * overlap / 2; b2.y += ny * overlap / 2;

                    let kx = b1.vx - b2.vx; let ky = b1.vy - b2.vy;
                    let p = nx * kx + ny * ky;

                    b1.vx -= p * nx; b1.vy -= p * ny;
                    b2.vx += p * nx; b2.vy += p * ny;
                    playTickSound();
                }
            }
        }
    }

    // 🎨 Premium Cyber Grid & Neon Render Graphics
    function draw() {
        ctx.clearRect(0, 0, WIDTH, HEIGHT);

        // 1. Cyber Grid Background (ကြာကြာကြည့်ရှုခံမည့် Premium Glow လိုင်းများ)
        ctx.strokeStyle = 'rgba(0, 255, 204, 0.03)';
        ctx.lineWidth = 2;
        let gridSize = 60;
        for (let x = 0; x < WIDTH; x += gridSize) {
            ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, HEIGHT); ctx.stroke();
        }
        for (let y = 0; y < HEIGHT; y += gridSize) {
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(WIDTH, y); ctx.stroke();
        }

        // 2. Center Predictive Outer Circle Glow
        ctx.beginPath();
        ctx.arc(center.x, center.y, fieldRadius + 15, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(0, 255, 204, 0.05)';
        ctx.lineWidth = 3;
        ctx.stroke();

        // 3. Main Center Circle
        ctx.beginPath();
        ctx.arc(center.x, center.y, fieldRadius, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
        ctx.lineWidth = 10; // High Def တွက် ထူထူဆွဲသည်
        ctx.stroke();

        // 4. Neon Cyber Goal Mesh
        ctx.save();
        ctx.translate(center.x, center.y);
        ctx.rotate(goalAngle);
        ctx.strokeStyle = '#00ffcc';
        ctx.lineWidth = 8;
        ctx.shadowBlur = 20;
        ctx.shadowColor = '#00ffcc';
        ctx.fillStyle = 'rgba(0, 255, 204, 0.15)';
        ctx.beginPath();
        ctx.arc(0, 0, fieldRadius + 50, -goalWidthAngle/2, goalWidthAngle/2);
        let endX = Math.cos(goalWidthAngle/2) * fieldRadius;
        let endY = Math.sin(goalWidthAngle/2) * fieldRadius;
        ctx.lineTo(endX, endY);
        ctx.arc(0, 0, fieldRadius, goalWidthAngle/2, -goalWidthAngle/2, true);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.restore();

        // 5. High Def Circular Flags Rendering
        balls.forEach(ball => {
            ctx.save();
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.clip();
            
            if (ball.img) {
                ctx.drawImage(ball.img, ball.x - ball.radius, ball.y - ball.radius, ball.radius * 2, ball.radius * 2);
            } else {
                ctx.fillStyle = ball.color;
                ctx.fill();
            }
            
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 5;
            ctx.stroke();
            ctx.restore();
        });
    }

    function mainLoop() {
        update();
        draw();
        requestAnimationFrame(mainLoop);
    }

    // -------------------------------------------------------------
    // 📹 1080p Export HD Recording Module Logic
    // -------------------------------------------------------------
    function startRecording() {
        recordedChunks = [];
        // Canvas stream ကို 60 FPS ဖြင့် ဖမ်းယူခြင်း
        const stream = canvas.captureStream(60); 
        
        // Browser က ထောက်ပံ့ပေးနိုင်မည့် ဗီဒီယို format ကို ရွေးချယ်ခြင်း
        let options = { mimeType: 'video/webm;codecs=vp9,opus', videoBitsPerSecond: 8000000 }; // 8Mbps High Quality
        try {
            mediaRecorder = new MediaRecorder(stream, options);
        } catch (e) {
            options = { mimeType: 'video/webm;codecs=vp8', videoBitsPerSecond: 5000000 };
            mediaRecorder = new MediaRecorder(stream, options);
        }

        mediaRecorder.ondataavailable = (event) => {
            if (event.data.size > 0) recordedChunks.push(event.data);
        };

        mediaRecorder.onstop = () => {
            const blob = new Blob(recordedChunks, { type: 'video/webm' });
            const url = URL.createObjectURL(blob);
            
            // Auto Download Link Engine Trigger
            const a = document.createElement('a');
            a.href = url;
            a.download = `${balls[0].name}_vs_${balls[1].name}_Prediction_1080p.webm`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            
            // Update Dashboard Text
            let winner = "DRAW MATCH";
            if (score.team1 > score.team2) winner = `${balls[0].name} WINS!`;
            else if (score.team2 > score.team1) winner = `${balls[1].name} WINS!`;
            
            document.getElementById('cardMain').innerText = winner;
            document.getElementById('aiStatus').innerText = "PREDICTION COMPLETE - VIDEO DOWNLOADED";
            document.getElementById('startRecordBtn').innerText = "SIMULATION CONCLUDED";
            document.getElementById('startRecordBtn').style.background = "#1e293b";
            document.getElementById('startRecordBtn').style.color = "#64748b";
        };

        mediaRecorder.start();
    }

    function stopRecordingAndDownload() {
        if (mediaRecorder && mediaRecorder.state !== 'inactive') {
            mediaRecorder.stop();
        }
    }

    // 🕹️ Setup Basic Synchronizers
    document.getElementById('t1Name').addEventListener('input', (e) => { balls[0].name = e.target.value.toUpperCase() || 'TEAM A'; });
    document.getElementById('t2Name').addEventListener('input', (e) => { balls[1].name = e.target.value.toUpperCase() || 'TEAM B'; });

    function bindUpload(inputId, ballIdx, flagId) {
        document.getElementById(inputId).addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    const img = new Image();
                    img.src = evt.target.result;
                    img.onload = () => { 
                        balls[ballIdx].img = img; 
                        document.getElementById(flagId).src = evt.target.result;
                    };
                };
                reader.readAsDataURL(file);
            }
        });
    }
    bindUpload('t1File', 0, 'flagLeft');
    bindUpload('t2File', 1, 'flagRight');

    // Click Launch Engine
    const startRecordBtn = document.getElementById('startRecordBtn');
    startRecordBtn.addEventListener('click', () => {
        if (virtualMinutes >= 90) return;
        if (isSimulating) return; // ခလုတ်ထပ်နှိပ်လို့မရအောင် ကာကွယ်ခြင်း

        if (audioCtx.state === 'suspended') audioCtx.resume();
        
        isSimulating = true;
        lastTimeUpdate = Date.now();
        document.getElementById('aiStatus').innerText = "SUPERCOMPUTER CALCULATING & RECORDING HD...";
        startRecordBtn.innerText = "RECORDING IN PROGRESS...";
        startRecordBtn.style.background = "#ef4444";
        startRecordBtn.style.color = "#fff";
        
        startRecording(); // ဗီဒီယိုဖမ်းယူခြင်း စတင်မည်
    });

    mainLoop();
</script>

</body>
</html>

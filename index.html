<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Circle Goal Simulation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        #canvasContainer {
            position: relative;
            width: 100%;
            max-width: 450px;
            height: 100vh;
            max-height: 800px;
            background-color: #0b7300; /* Football Field Green */
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow: hidden;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
</head>
<body>

<div id="canvasContainer">
    <canvas id="gameCanvas"></canvas>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // -------------------------------------------------------------
    // ⭐ စိတ်ကြိုက်ပြင်ဆင်နိုင်သော အပိုင်း (IMAGE URL များ ထည့်ရန်)
    // -------------------------------------------------------------
    const IRAQ_IMAGE_URL = 'https://picsum.photos/id/237/100/100';      
    const VENEZUELA_IMAGE_URL = 'https://picsum.photos/id/1025/100/100'; 
    // -------------------------------------------------------------

    const WIDTH = 450;
    const HEIGHT = 800;
    canvas.width = WIDTH;
    canvas.height = HEIGHT;

    const center = { x: WIDTH / 2, y: HEIGHT / 2 + 30 };
    const fieldRadius = 150; 

    // Score & Timer
    let score = { iraq: 0, venezuela: 0 };
    let startTime = Date.now();

    // ဂိုးပေါက် တည်နေရာ (အစပိုင်းတွင် အပေါ်တည့်တည့်၌ ထားမည်)
    let goalAngle = -Math.PI / 2; 
    const goalWidthAngle = 0.5; // ဂိုးပေါက် အကျယ်အဝန်း

    // Images Loading
    const imgIraq = new Image(); imgIraq.src = IRAQ_IMAGE_URL;
    const imgVenezuela = new Image(); imgVenezuela.src = VENEZUELA_IMAGE_URL;

    const balls = [
        { name: 'Iraq', x: center.x - 30, y: center.y - 20, vx: 3.5, vy: -4, radius: 20, img: imgIraq, isGoalOut: false, color: '#ff4d4d' },
        { name: 'Venezuela', x: center.x + 30, y: center.y + 20, vx: -4, vy: 3.5, radius: 20, img: imgVenezuela, isGoalOut: false, color: '#4d94ff' }
    ];

    // 🔊 Web Audio API ဖြင့် ပြင်ပဖိုင်မလိုဘဲ အသံဖန်တီးခြင်း
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playTickSound() {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(600, audioCtx.currentTime); // တောက် တောက် အသံ
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.05);
    }

    function playGoalSound() {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        // ပရိသတ်အော်သံပုံစံ Noise ဖန်တီးခြင်း
        const bufferSize = audioCtx.sampleRate * 1.5;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1;
        }
        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(400, audioCtx.currentTime);
        
        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.5);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);
        noise.start();
    }

    function resetBall(ball) {
        ball.x = center.x + (Math.random() * 40 - 20);
        ball.y = center.y + (Math.random() * 40 - 20);
        ball.vx = (Math.random() > 0.5 ? 1 : -1) * (3.5 + Math.random() * 1.5);
        ball.vy = (Math.random() > 0.5 ? 1 : -1) * (3.5 + Math.random() * 1.5);
        ball.isGoalOut = false;
    }

    // ⚙️ Logic Update
    function update() {
        balls.forEach(ball => {
            if (ball.isGoalOut) {
                ball.x += ball.vx;
                ball.y += ball.vy;
                if (ball.x < -50 || ball.x > WIDTH + 50 || ball.y < -50 || ball.y > HEIGHT + 50) {
                    resetBall(ball);
                }
                return;
            }

            ball.x += ball.vx;
            ball.y += ball.vy;

            let dx = ball.x - center.x;
            let dy = ball.y - center.y;
            let distance = Math.sqrt(dx * dx + dy * dy);

            if (distance + ball.radius >= fieldRadius) {
                let ballAngle = Math.atan2(dy, dx);
                
                // လက်ရှိ ဂိုးပေါက်ရဲ့ Angle အကွာအဝေးကို စစ်ဆေးခြင်း
                let angleDiff = Math.abs(ballAngle - goalAngle);
                if (angleDiff > Math.PI) angleDiff = Math.PI * 2 - angleDiff;

                if (angleDiff < goalWidthAngle / 2) {
                    // ⚽ ဂိုးဝင်သွားပြီ!
                    ball.isGoalOut = true;
                    playGoalSound();
                    if (ball.name === 'Iraq') score.iraq++;
                    else score.venezuela++;
                } else {
                    // 튕 ဘောင်ကို တိုက်မိလျှင် လမ်းကြောင်းပြောင်းမည်
                    let nx = dx / distance;
                    let ny = dy / distance;

                    ball.x = center.x + nx * (fieldRadius - ball.radius);
                    ball.y = center.y + ny * (fieldRadius - ball.radius);

                    let dotProduct = ball.vx * nx + ball.vy * ny;
                    ball.vx = ball.vx - 2 * dotProduct * nx;
                    ball.vy = ball.vy - 2 * dotProduct * ny;

                    // ⭐ [ပြင်ဆင်ချက်] ဘောလုံးတိုက်မိတဲ့ နေရာကို ဂိုးပေါက် ချက်ချင်း ရွှေ့ပေးခြင်း
                    goalAngle = ballAngle;
                    playTickSound();
                }
            }
        });

        // ဘောလုံးအချင်းချင်း တိုက်မိခြင်း
        for (let i = 0; i < balls.length; i++) {
            for (let j = i + 1; j < balls.length; j++) {
                let b1 = balls[i]; let b2 = balls[j];
                if (b1.isGoalOut || b2.isGoalOut) continue;

                let dx = b2.x - b1.x;
                let dy = b2.y - b1.y;
                let dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < b1.radius + b2.radius) {
                    let overlap = (b1.radius + b2.radius) - dist;
                    let nx = dx / dist; let ny = dy / dist;

                    b1.x -= nx * overlap / 2; b1.y -= ny * overlap / 2;
                    b2.x += nx * overlap / 2; b2.y += ny * overlap / 2;

                    let kx = b1.vx - b2.vx; let ky = b1.vy - b2.vy;
                    let p = nx * kx + ny * ky;

                    b1.vx -= p * nx; b1.vy -= p * ny;
                    b2.vx += p * nx; b2.vy += p * ny;
                    playTickSound();
                }
            }
        }
    }

    // 🎨 UI နှင့် ဂရပ်ဖစ်ဆွဲခြင်း
    function draw() {
        ctx.clearRect(0, 0, WIDTH, HEIGHT);
        
        // 1. ေနာင်ခံမြက်ခင်း
        ctx.fillStyle = '#0b7300';
        ctx.fillRect(0, 0, WIDTH, HEIGHT);

        // 2. ရမှတ်ဘုတ်နှင့် Timer (ဗီဒီယိုထဲကပုံစံအတိုင်း)
        // နိုင်ငံအလံများအတွက် အရောင်ကွက် (နောက်မှ ပုံထည့်နိုင်သည်)
        ctx.fillStyle = '#4d94ff'; ctx.fillRect(WIDTH/2 - 75, 40, 40, 25); // Venezuela Color
        ctx.fillStyle = '#ff4d4d'; ctx.fillRect(WIDTH/2 + 35, 40, 40, 25); // Iraq Color

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 28px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(`${score.venezuela} - ${score.iraq}`, WIDTH / 2, 63);

        // Timer တွက်ချက်ခြင်း
        let diff = Date.now() - startTime;
        let mins = Math.floor(diff / 60000).toString().padStart(2, '0');
        let secs = Math.floor((diff % 60000) / 1000).toString().padStart(2, '0');
        ctx.font = '22px sans-serif';
        ctx.fillText(`${mins}:${secs}`, WIDTH / 2, 100);

        // 3. အလယ်အဝိုင်းကွင်းဆွဲခြင်း
        ctx.beginPath();
        ctx.arc(center.x, center.y, fieldRadius, 0, Math.PI * 2);
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 5;
        ctx.stroke();

        // 4. ဂိုးပေါက်ဆွဲခြင်း (ကွက်ကျားပိုက်ကွန်ပုံစံ)
        ctx.save();
        ctx.translate(center.x, center.y);
        ctx.rotate(goalAngle);
        
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 4;
        ctx.fillStyle = 'rgba(255,255,255,0.15)';
        ctx.beginPath();
        ctx.arc(0, 0, fieldRadius + 25, -goalWidthAngle/2, goalWidthAngle/2);
        let endX = Math.cos(goalWidthAngle/2) * fieldRadius;
        let endY = Math.sin(goalWidthAngle/2) * fieldRadius;
        ctx.lineTo(endX, endY);
        ctx.arc(0, 0, fieldRadius, goalWidthAngle/2, -goalWidthAngle/2, true);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.restore();

        // 5. ဘောလုံးများဆွဲခြင်း
        balls.forEach(ball => {
            ctx.save();
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.clip();
            
            try {
                ctx.drawImage(ball.img, ball.x - ball.radius, ball.y - ball.radius, ball.radius * 2, ball.radius * 2);
            } catch (e) {
                ctx.fillStyle = ball.color;
                ctx.fill();
            }
            
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.restore();
        });
    }

    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    // ပထမဆုံး Screen ကို ကလစ်နှိပ်မှ အသံစနစ် စတင်အလုပ်လုပ်မည်
    window.addEventListener('click', () => {
        if (audioCtx.state === 'suspended') audioCtx.resume();
    });

    loop();
</script>

</body>
</html>

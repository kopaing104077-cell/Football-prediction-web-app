<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Circle Goal Simulation with Uploads</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        /* 9:16 Vertical Container */
        #canvasContainer {
            position: relative;
            width: 100%;
            max-width: 450px;
            height: 100vh;
            max-height: 800px;
            background-color: #0b7300; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        
        /* Game Area Canvas */
        canvas {
            width: 100%;
            flex: 1;
            display: block;
        }

        /* 🛠️ အောက်ခြေ Control Panel (ဗီဒီယိုထဲက ပုံစံအတိုင်း ဖန်တီးထားသည်) */
        .control-panel {
            background-color: #000000;
            padding: 15px;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 10;
        }

        .teams-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .team-box {
            flex: 1;
            background: #111;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .team-box input[type="text"] {
            width: 100%;
            background: #222;
            border: 1px solid #444;
            color: #fff;
            padding: 4px 8px;
            border-radius: 5px;
            text-align: center;
            font-size: 13px;
        }

        .upload-btn {
            background: #0b7300;
            color: white;
            font-size: 11px;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            text-align: center;
            width: 100%;
        }

        .upload-btn input[type="file"] {
            display: none;
        }

        .center-info {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-width: 80px;
        }

        .status-txt {
            font-size: 12px;
            color: #888;
            margin-bottom: 4px;
        }

        .action-btn {
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            font-size: 12px;
            width: 100%;
        }
    </style>
</head>
<body>

<div id="canvasContainer">
    <canvas id="gameCanvas"></canvas>

    <div class="control-panel">
        <div class="teams-row">
            <div class="team-box">
                <input type="text" id="team1Name" value="Venezuela">
                <label class="upload-btn">
                    📷 ပုံတင်ရန်
                    <input type="file" id="team1Img" accept="image/*">
                </label>
            </div>

            <div class="center-info">
                <span class="status-txt" id="matchDay">Tomorrow</span>
                <button class="action-btn" id="startBtn">START</button>
            </div>

            <div class="team-box">
                <input type="text" id="team2Name" value="Iraq">
                <label class="upload-btn">
                    📷 ပုံတင်ရန်
                    <input type="file" id="team2Img" accept="image/*">
                </label>
            </div>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Canvas ပတ်ဝန်းကျင် အရွယ်အစား သတ်မှတ်ချက်
    const WIDTH = 450;
    const HEIGHT = 650; // Control panel စာမျက်နှာအတွက် နေရာချန်ပြီး ကျုံ့ထားသည်
    canvas.width = WIDTH;
    canvas.height = HEIGHT;

    const center = { x: WIDTH / 2, y: HEIGHT / 2 + 20 };
    const fieldRadius = 135; 

    let score = { team1: 0, team2: 0 };
    let startTime = Date.now();
    let isRunning = false; 

    let goalAngle = -Math.PI / 2; 
    const goalWidthAngle = 0.5; 

    // Default အရောင်အဝိုင်းများ (ပုံမတင်ခင် ပြသရန်)
    let img1Data = null;
    let img2Data = null;

    const balls = [
        { id: 'team1', name: 'Venezuela', x: center.x - 40, y: center.y + 30, vx: -4, vy: 3, radius: 20, img: null, isGoalOut: false, color: '#4d94ff' },
        { id: 'team2', name: 'Iraq', x: center.x + 40, y: center.y - 30, vx: 3.5, vy: -4, radius: 20, img: null, isGoalOut: false, color: '#ff4d4d' }
    ];

    // 🔊 Web Audio API
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playTickSound() {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(600, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.05);
    }

    function playGoalSound() {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const bufferSize = audioCtx.sampleRate * 1.5;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1;
        }
        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(400, audioCtx.currentTime);
        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.5);
        noise.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);
        noise.start();
    }

    function resetBall(ball) {
        ball.x = center.x + (Math.random() * 40 - 20);
        ball.y = center.y + (Math.random() * 40 - 20);
        ball.vx = (Math.random() > 0.5 ? 1 : -1) * (3.5 + Math.random() * 1.5);
        ball.vy = (Math.random() > 0.5 ? 1 : -1) * (3.5 + Math.random() * 1.5);
        ball.isGoalOut = false;
    }

    // ⚙️ Logic Update
    function update() {
        if (!isRunning) return;

        balls.forEach(ball => {
            if (ball.isGoalOut) {
                ball.x += ball.vx;
                ball.y += ball.vy;
                if (ball.x < -50 || ball.x > WIDTH + 50 || ball.y < -50 || ball.y > HEIGHT + 50) {
                    resetBall(ball);
                }
                return;
            }

            ball.x += ball.vx;
            ball.y += ball.vy;

            let dx = ball.x - center.x;
            let dy = ball.y - center.y;
            let distance = Math.sqrt(dx * dx + dy * dy);

            if (distance + ball.radius >= fieldRadius) {
                let ballAngle = Math.atan2(dy, dx);
                let angleDiff = Math.abs(ballAngle - goalAngle);
                if (angleDiff > Math.PI) angleDiff = Math.PI * 2 - angleDiff;

                if (angleDiff < goalWidthAngle / 2) {
                    ball.isGoalOut = true;
                    playGoalSound();
                    if (ball.id === 'team1') score.team1++;
                    else score.team2++;
                } else {
                    let nx = dx / distance;
                    let ny = dy / distance;

                    ball.x = center.x + nx * (fieldRadius - ball.radius);
                    ball.y = center.y + ny * (fieldRadius - ball.radius);

                    let dotProduct = ball.vx * nx + ball.vy * ny;
                    ball.vx = ball.vx - 2 * dotProduct * nx;
                    ball.vy = ball.vy - 2 * dotProduct * ny;

                    goalAngle = ballAngle;
                    playTickSound();
                }
            }
        });

        // ဘောလုံးအချင်းချင်း တိုက်မိခြင်း
        for (let i = 0; i < balls.length; i++) {
            for (let j = i + 1; j < balls.length; j++) {
                let b1 = balls[i]; let b2 = balls[j];
                if (b1.isGoalOut || b2.isGoalOut) continue;

                let dx = b2.x - b1.x;
                let dy = b2.y - b1.y;
                let dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < b1.radius + b2.radius) {
                    let overlap = (b1.radius + b2.radius) - dist;
                    let nx = dx / dist; let ny = dy / dist;

                    b1.x -= nx * overlap / 2; b1.y -= ny * overlap / 2;
                    b2.x += nx * overlap / 2; b2.y += ny * overlap / 2;

                    let kx = b1.vx - b2.vx; let ky = b1.vy - b2.vy;
                    let p = nx * kx + ny * ky;

                    b1.vx -= p * nx; b1.vy -= p * ny;
                    b2.vx += p * nx; b2.vy += p * ny;
                    playTickSound();
                }
            }
        }
    }

    // 🎨 UI နှင့် ဂရပ်ဖစ်ဆွဲခြင်း
    function draw() {
        ctx.clearRect(0, 0, WIDTH, HEIGHT);
        
        // ေနာင်ခံမြက်ခင်း
        ctx.fillStyle = '#0b7300';
        ctx.fillRect(0, 0, WIDTH, HEIGHT);

        // ရမှတ်ဘုတ်နှင့် Timer
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 26px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(`${balls[0].name}  ${score.team1} - ${score.team2}  ${balls[1].name}`, WIDTH / 2, 60);

        let timeText = "00:00";
        if (isRunning) {
            let diff = Date.now() - startTime;
            let mins = Math.floor(diff / 60000).toString().padStart(2, '0');
            let secs = Math.floor((diff % 60000) / 1000).toString().padStart(2, '0');
            timeText = `${mins}:${secs}`;
        }
        ctx.font = '20px sans-serif';
        ctx.fillText(timeText, WIDTH / 2, 95);

        // အလယ်အဝိုင်းကွင်း
        ctx.beginPath();
        ctx.arc(center.x, center.y, fieldRadius, 0, Math.PI * 2);
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 5;
        ctx.stroke();

        // ဂိုးပေါက်
        ctx.save();
        ctx.translate(center.x, center.y);
        ctx.rotate(goalAngle);
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 4;
        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        ctx.beginPath();
        ctx.arc(0, 0, fieldRadius + 25, -goalWidthAngle/2, goalWidthAngle/2);
        let endX = Math.cos(goalWidthAngle/2) * fieldRadius;
        let endY = Math.sin(goalWidthAngle/2) * fieldRadius;
        ctx.lineTo(endX, endY);
        ctx.arc(0, 0, fieldRadius, goalWidthAngle/2, -goalWidthAngle/2, true);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.restore();

        // ဘောလုံးများဆွဲခြင်း
        balls.forEach(ball => {
            ctx.save();
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.clip();
            
            if (ball.img) {
                ctx.drawImage(ball.img, ball.x - ball.radius, ball.y - ball.radius, ball.radius * 2, ball.radius * 2);
            } else {
                ctx.fillStyle = ball.color;
                ctx.fill();
            }
            
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.restore();
        });
    }

    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    // -------------------------------------------------------------
    // 🕹️ UI Event Listeners (အသုံးပြုသူ စိတ်ကြိုက်ပြောင်းလဲနိုင်သော အပိုင်း)
    // -------------------------------------------------------------
    
    // ၁။ နာမည်များ ပြောင်းလဲခြင်း စနစ်
    document.getElementById('team1Name').addEventListener('input', (e) => {
        balls[0].name = e.target.value || 'Team A';
    });
    document.getElementById('team2Name').addEventListener('input', (e) => {
        balls[1].name = e.target.value || 'Team B';
    });

    // ၂။ ပုံများကို Upload လုပ်ပြီး ဘောလုံးထဲ ထည့်သွင်းခြင်း စနစ်
    document.getElementById('team1Img').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => { balls[0].img = img; };
            };
            reader.readAsDataURL(file);
        }
    });

    document.getElementById('team2Img').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => { balls[1].img = img; };
            };
            reader.readAsDataURL(file);
        }
    });

    // ၃။ Start / Pause ခလုတ် စနစ်
    const startBtn = document.getElementById('startBtn');
    startBtn.addEventListener('click', () => {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        
        isRunning = !isRunning;
        if (isRunning) {
            startBtn.innerText = "PAUSE";
            startBtn.style.background = "#ff4d4d";
            startBtn.style.color = "#fff";
            startTime = Date.now(); // Timer ကို ပြန်စမည်
        } else {
            startBtn.innerText = "START";
            startBtn.style.background = "#ffffff";
            startBtn.style.color = "#000000";
        }
    });

    loop();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Circle Prediction Video Generator (1080p)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        
        /* 9:16 Vertical Screen Container */
        #container3G {
            position: relative;
            width: 100%;
            max-width: 430px;
            height: 100vh;
            max-height: 780px;
            background-color: #0d8a00; /* ဗီဒီယိုထဲက မြက်ခင်းစိမ်းရောင် အစစ် */
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 30px 0;
        }

        /* Top Header Scoreboard */
        .scoreboard-top {
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }
        .score-row-display {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .flag-box {
            width: 38px;
            height: 25px;
            background-color: #222;
            border: 1px solid #ffffff;
            object-fit: cover;
            border-radius: 2px;
        }
        .score-live-text {
            color: #ffffff;
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .time-live-text {
            color: #ffffff;
            font-size: 24px;
            margin-top: 5px;
            font-weight: 500;
        }

        /* Canvas Pitch Layout */
        canvas {
            width: 100%;
            height: 380px;
            display: block;
        }

        /* Bottom Match Card (ဗီဒီယိုထဲကအတိုင်း အနက်ရောင် Card အဝိုင်း) */
        .bottom-match-card {
            background-color: #000000;
            width: 85%;
            border-radius: 18px;
            padding: 12px 15px;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
            z-index: 10;
        }
        .match-meta-info {
            font-size: 11px;
            color: #aaaaaa;
            margin-bottom: 3px;
        }
        .match-main-status {
            font-size: 19px;
            font-weight: bold;
            margin-bottom: 12px;
        }
        .teams-io-row {
            display: flex;
            justify-content: space-between;
            width: 100%;
            gap: 10px;
            margin-bottom: 12px;
        }
        .team-io-box {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #0f0f0f;
            padding: 6px;
            border-radius: 10px;
            border: 1px solid #1a1a1a;
        }
        .team-io-box input[type="text"] {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 1px solid #333;
            color: #fff;
            padding: 4px;
            text-align: center;
            font-size: 13px;
            font-weight: bold;
            outline: none;
            margin-bottom: 5px;
        }
        .uploader-lbl {
            font-size: 10px;
            color: #0d8a00;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
        }
        .uploader-lbl input[type="file"] {
            display: none;
        }

        /* Record Button */
        .record-trigger-btn {
            width: 100%;
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 10px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: 0.2s;
        }
        .record-trigger-btn:hover {
            background: #dddddd;
        }
    </style>
</head>
<body>

<div id="container3G">
    <div class="scoreboard-top">
        <div class="score-row-display">
            <img id="flagDisplayL" class="flag-box" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" style="background-color: #ffcc00;">
            <div class="score-live-text" id="liveScoreLabel">0 - 0</div>
            <img id="flagDisplayR" class="flag-box" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" style="background-color: #cc0000;">
        </div>
        <div class="time-live-text" id="liveTimeLabel">00:00</div>
    </div>

    <canvas id="predictionCanvas"></canvas>

    <div class="bottom-match-card">
        <div class="match-meta-info">6/10</div>
        <div class="match-main-status" id="statusHeaderText">Tomorrow</div>
        
        <div class="teams-io-row">
            <div class="team-io-box">
                <input type="text" id="nameInputL" value="Iraq">
                <label class="uploader-lbl">📷 Upload Logo
                    <input type="file" id="fileInputL" accept="image/*">
                </label>
            </div>
            <div class="team-io-box">
                <input type="text" id="nameInputR" value="Venezuela">
                <label class="uploader-lbl">📷 Upload Logo
                    <input type="file" id="fileInputR" accept="image/*">
                </label>
            </div>
        </div>

        <button class="record-trigger-btn" id="startRecordingActionBtn">Start Predict & Download 1080p</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('predictionCanvas');
    const ctx = canvas.getContext('2d');

    // 1080p Internal Quality Resolution Setup
    const internalW = 1080;
    const internalH = 960;
    canvas.width = internalW;
    canvas.height = internalH;

    const centerPoint = { x: internalW / 2, y: internalH / 2 };
    const ringRadius = 340; 

    let scoreState = { left: 0, right: 0 };
    let isMatchRunning = false;
    
    // ⏱️ ၁၅ စက္ကန့် စနစ် (၁၅ စက္ကန့် = မိနစ် ၉၀ ပွဲပြီး)
    let minutesCounter = 0;
    let secondsCounter = 0;
    let totalElapsedMs = 0;
    let previousTimeFrame = 0;
    const matchTotalSeconds = 15; 

    // 🥅 အမြဲတမ်း ပတ်ချာလည်နေသော ဂိုးပေါက်စနစ်
    let currentGoalAngle = 0;
    const goalRotationSpeed = 0.016; 
    const netWidthAngle = 0.32; 

    const gameBalls = [
        { id: 'left', name: 'Iraq', x: centerPoint.x - 70, y: centerPoint.y + 30, vx: -12, vy: 11, radius: 42, img: null, isGoalOut: false, color: '#ffcc00' },
        { id: 'right', name: 'Venezuela', x: centerPoint.x + 70, y: centerPoint.y - 30, vx: 11, vy: -12, radius: 42, img: null, isGoalOut: false, color: '#cc0000' }
    ];

    let particleTrails = [];
    let videoMediaRecorder;
    let chunksOfVideo = [];

    // Audio Engine
    const soundContext = new (window.AudioContext || window.webkitAudioContext)();

    function triggerTickAudio() {
        if (soundContext.state === 'suspended') soundContext.resume();
        const oscillator = soundContext.createOscillator();
        const nodeGain = soundContext.createGain();
        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(450, soundContext.currentTime);
        nodeGain.gain.setValueAtTime(0.08, soundContext.currentTime);
        nodeGain.gain.exponentialRampToValueAtTime(0.001, soundContext.currentTime + 0.04);
        oscillator.connect(nodeGain);
        nodeGain.connect(soundContext.destination);
        oscillator.start();
        oscillator.stop(soundContext.currentTime + 0.04);
    }

    function triggerGoalAudio() {
        if (soundContext.state === 'suspended') soundContext.resume();
        const size = soundContext.sampleRate * 1.2;
        const audioBuffer = soundContext.createBuffer(1, size, soundContext.sampleRate);
        const bufferData = audioBuffer.getChannelData(0);
        for (let idx = 0; idx < size; idx++) {
            bufferData[idx] = Math.random() * 2 - 1;
        }
        const audioSource = soundContext.createBufferSource();
        audioSource.buffer = audioBuffer;
        const lowpassFilter = soundContext.createBiquadFilter();
        lowpassFilter.type = 'lowpass';
        lowpassFilter.frequency.setValueAtTime(400, soundContext.currentTime);
        const nodeGain = soundContext.createGain();
        nodeGain.gain.setValueAtTime(0.25, soundContext.currentTime);
        nodeGain.gain.exponentialRampToValueAtTime(0.005, soundContext.currentTime + 1.2);
        audioSource.connect(lowpassFilter);
        lowpassFilter.connect(nodeGain);
        nodeGain.connect(soundContext.destination);
        audioSource.start();
    }

    function spawnParticles(x, y, color) {
        for (let i = 0; i < 8; i++) {
            particleTrails.push({
                x: x, y: y,
                vx: (Math.random() - 0.5) * 6,
                vy: (Math.random() - 0.5) * 6,
                life: 1.0,
                color: color
            });
        }
    }

    function respawnBallObject(ballObj) {
        ballObj.x = centerPoint.x + (Math.random() * 40 - 20);
        ballObj.y = centerPoint.y + (Math.random() * 40 - 20);
        ballObj.vx = (Math.random() > 0.5 ? 1 : -1) * (11 + Math.random() * 4);
        ballObj.vy = (Math.random() > 0.5 ? 1 : -1) * (11 + Math.random() * 4);
        ballObj.isGoalOut = false;
    }

    // Physics Update Logic
    function updatePhysicsEngine(delta) {
        // ဂိုးပေါက်အမြဲတမ်းလည်ပတ်နေစေခြင်း
        currentGoalAngle += goalRotationSpeed;
        if (currentGoalAngle > Math.PI * 2) currentGoalAngle -= Math.PI * 2;

        if (!isMatchRunning) return;

        // ⏱️ Clock Update
        totalElapsedMs += delta;
        const dynamicProgress = totalElapsedMs / (matchTotalSeconds * 1000);
        const currentMatchMinutes = Math.min(90, Math.floor(dynamicProgress * 90));
        const currentMatchSeconds = Math.floor((dynamicProgress * 90 * 60) % 60);

        if (dynamicProgress >= 1.0) {
            isMatchRunning = false;
            minutesCounter = 90;
            secondsCounter = 0;
            document.getElementById('liveTimeLabel').innerText = "90:00";
            finalizeSimulationVideo();
            return;
        }

        document.getElementById('liveTimeLabel').innerText = 
            `${currentMatchMinutes.toString().padStart(2, '0')}:${currentMatchSeconds.toString().padStart(2, '0')}`;

        // Particle System Update
        particleTrails.forEach((p, idx) => {
            p.x += p.vx; p.y += p.vy; p.life -= 0.04;
            if (p.life <= 0) particleTrails.splice(idx, 1);
        });

        gameBalls.forEach(ball => {
            if (ball.isGoalOut) {
                ball.x += ball.vx; ball.y += ball.vy;
                if (ball.x < -100 || ball.x > internalW + 100 || ball.y < -100 || ball.y > internalH + 100) {
                    respawnBallObject(ball);
                }
                return;
            }

            ball.x += ball.vx;
            ball.y += ball.vy;

            let diffX = ball.x - centerPoint.x;
            let diffY = ball.y - centerPoint.y;
            let currentDist = Math.sqrt(diffX * diffX + diffY * diffY);

            if (currentDist + ball.radius >= ringRadius) {
                let ballPositionAngle = Math.atan2(diffY, diffX);
                if (ballPositionAngle < 0) ballPositionAngle += Math.PI * 2;

                let differenceAngle = Math.abs(ballPositionAngle - currentGoalAngle);
                if (differenceAngle > Math.PI) differenceAngle = Math.PI * 2 - differenceAngle;

                if (differenceAngle < netWidthAngle / 2) {
                    // Goal In!
                    ball.isGoalOut = true;
                    triggerGoalAudio();
                    if (ball.id === 'left') scoreState.left++;
                    else scoreState.right++;
                    document.getElementById('liveScoreLabel').innerText = `${scoreState.left} - ${scoreState.right}`;
                } else {
                    // Bounce Off Circle
                    let normX = diffX / currentDist;
                    let normY = diffY / currentDist;

                    ball.x = centerPoint.x + normX * (ringRadius - ball.radius);
                    ball.y = centerPoint.y + normY * (ringRadius - ball.radius);

                    let product = ball.vx * normX + ball.vy * normY;
                    ball.vx = ball.vx - 2 * product * normX;
                    ball.vy = ball.vy - 2 * product * normY;

                    // ဗီဒီယိုအတိုင်း အမှုန်လေးများထွက်ခြင်း
                    spawnParticles(ball.x, ball.y, ball.color);
                    triggerTickAudio();
                }
            }
        });

        // Ball vs Ball Physics
        for (let i = 0; i < gameBalls.length; i++) {
            for (let j = i + 1; j < gameBalls.length; j++) {
                let b1 = gameBalls[i]; let b2 = gameBalls[j];
                if (b1.isGoalOut || b2.isGoalOut) continue;

                let dX = b2.x - b1.x; let dY = b2.y - b1.y;
                let currentDistance = Math.sqrt(dX * dX + dY * dY);

                if (currentDistance < b1.radius + b2.radius) {
                    let overlappingSpace = (b1.radius + b2.radius) - currentDistance;
                    let normX = dX / currentDistance; let normY = dY / currentDistance;

                    b1.x -= normX * overlappingSpace / 2; b1.y -= normY * overlappingSpace / 2;
                    b2.x += normX * overlappingSpace / 2; b2.y += normY * overlappingSpace / 2;

                    let relativeKx = b1.vx - b2.vx; let relativeKy = b1.vy - b2.vy;
                    let dotProd = normX * relativeKx + normY * relativeKy;

                    b1.vx -= dotProd * normX; b1.vy -= dotProd * normY;
                    b2.vx += dotProd * normX; b2.vy += dotProd * normY;
                    triggerTickAudio();
                }
            }
        }
    }

    // Graphical Render Engine
    function renderGraphics() {
        ctx.clearRect(0, 0, internalW, internalH);

        // Main Field Ring Line
        ctx.beginPath();
        ctx.arc(centerPoint.x, centerPoint.y, ringRadius, 0, Math.PI * 2);
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 14;
        ctx.stroke();

        // 🥅 Rotating Net Goal Design (ဗီဒီယိုထဲကအတိုင်း လှပသော လှေကားကွက် ပိုက်ကွန်ပုံစံ)
        ctx.save();
        ctx.translate(centerPoint.x, centerPoint.y);
        ctx.rotate(currentGoalAngle);
        
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 6;
        ctx.beginPath();
        
        let initialAngle = -netWidthAngle / 2;
        let finalAngle = netWidthAngle / 2;
        
        // ပိုက်ကွန် ဘောင်လိုင်းဆွဲခြင်း
        ctx.arc(0, 0, ringRadius + 45, initialAngle, finalAngle);
        let cornerX = Math.cos(finalAngle) * ringRadius;
        let cornerY = Math.sin(finalAngle) * ringRadius;
        ctx.lineTo(cornerX, cornerY);
        ctx.arc(0, 0, ringRadius, finalAngle, initialAngle, true);
        ctx.closePath();
        ctx.stroke();

        // ပိုက်ကွန်အတွင်းက အကွက်လိုင်းလေးများ ဆွဲခြင်း
        ctx.lineWidth = 3;
        for (let angleStep = initialAngle; angleStep <= finalAngle; angleStep += 0.06) {
            ctx.beginPath();
            ctx.moveTo(Math.cos(angleStep) * ringRadius, Math.sin(angleStep) * ringRadius);
            ctx.lineTo(Math.cos(angleStep) * (ringRadius + 45), Math.sin(angleStep) * (ringRadius + 45));
            ctx.stroke();
        }
        for (let hRadius = ringRadius + 15; hRadius < ringRadius + 45; hRadius += 15) {
            ctx.beginPath();
            ctx.arc(0, 0, hRadius, initialAngle, finalAngle);
            ctx.stroke();
        }
        ctx.restore();

        // Draw Particles
        particleTrails.forEach(p => {
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.life;
            ctx.beginPath();
            ctx.arc(p.x, p.y, 6, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1.0;
        });

        // Draw Team Flag Balls
        gameBalls.forEach(ball => {
            ctx.save();
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.clip();
            
            if (ball.img) {
                ctx.drawImage(ball.img, ball.x - ball.radius, ball.y - ball.radius, ball.radius * 2, ball.radius * 2);
            } else {
                ctx.fillStyle = ball.color;
                ctx.fill();
            }
            
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 4;
            ctx.stroke();
            ctx.restore();
        });
    }

    // Animation Engine Initialization
    function executeMainLoop(timestamp) {
        if (!previousTimeFrame) previousTimeFrame = timestamp;
        let delta = timestamp - previousTimeFrame;
        if (delta > 100) delta = 16; 
        previousTimeFrame = timestamp;

        updatePhysicsEngine(delta);
        renderGraphics();
        requestAnimationFrame(executeMainLoop);
    }

    // Video Recording Capture Module
    function initiateVideoCapturer() {
        chunksOfVideo = [];
        const captureStream = canvas.captureStream(60); // 60 FPS HD Capture
        videoMediaRecorder = new MediaRecorder(captureStream, { mimeType: 'video/webm;codecs=vp9', videoBitsPerSecond: 9000000 });
        
        videoMediaRecorder.ondataavailable = (event) => {
            if (event.data.size > 0) chunksOfVideo.push(event.data);
        };

        videoMediaRecorder.onstop = () => {
            const finalBlob = new Blob(chunksOfVideo, { type: 'video/webm' });
            const temporaryUrl = URL.createObjectURL(finalBlob);
            const downloadAnchor = document.createElement('a');
            downloadAnchor.href = temporaryUrl;
            downloadAnchor.download = `Prediction_${gameBalls[0].name}_vs_${gameBalls[1].name}.webm`;
            downloadAnchor.click();
            
            let finalWinner = "DRAW MATCH";
            if (scoreState.left > scoreState.right) finalWinner = `${gameBalls[0].name} WINS`;
            else if (scoreState.right > scoreState.left) finalWinner = `${gameBalls[1].name} WINS`;
            
            document.getElementById('statusHeaderText').innerText = finalWinner;
            document.getElementById('startRecordingActionBtn').innerText = "PREDICTION COMPLETE";
            document.getElementById('startRecordingActionBtn').style.background = "#333";
            document.getElementById('startRecordingActionBtn').style.color = "#777";
        };

        videoMediaRecorder.start();
    }

    function finalizeSimulationVideo() {
        if (videoMediaRecorder && videoMediaRecorder.state !== 'inactive') {
            videoMediaRecorder.stop();
        }
    }

    // Sync Text UI Input
    document.getElementById('nameInputL').addEventListener('input', (e) => { gameBalls[0].name = e.target.value || 'Team 1'; });
    document.getElementById('nameInputR').addEventListener('input', (e) => { gameBalls[1].name = e.target.value || 'Team 2'; });

    // Image Upload Pipeline Connection
    function establishImageUploader(inputId, index, targetFlagId) {
        document.getElementById(inputId).addEventListener('change', function(event) {
            const activeFile = event.target.files[0];
            if (activeFile) {
                const fileReader = new FileReader();
                fileReader.onload = function(evt) {
                    const imgObj = new Image();
                    imgObj.src = evt.target.result;
                    imgObj.onload = () => { 
                        gameBalls[index].img = imgObj; 
                        document.getElementById(targetFlagId).src = evt.target.result;
                    };
                };
                fileReader.readAsDataURL(activeFile);
            }
        });
    }
    establishImageUploader('fileInputL', 0, 'flagDisplayL');
    establishImageUploader('fileInputR', 1, 'flagDisplayR');

    // Trigger Simulation Action
    const recordActionBtn = document.getElementById('startRecordingActionBtn');
    recordActionBtn.addEventListener('click', () => {
        if (minutesCounter >= 90 || isMatchRunning) return;
        
        if (soundContext.state === 'suspended') soundContext.resume();
        
        isMatchRunning = true;
        totalElapsedMs = 0;
        previousTimeFrame = performance.now();
        recordActionBtn.innerText = "Simulating & Recording HD...";
        recordActionBtn.style.background = "#cc0000";
        recordActionBtn.style.color = "#fff";
        
        initiateVideoCapturer();
    });

    // Start Engine On Load
    requestAnimationFrame(executeMainLoop);
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AI Football Prediction Video Generator Pro</title>

<!-- Fonts & Icons -->
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

<style>
:root{
  --bg:#0b0f1a;
  --panel:#121a2a;
  --glass:rgba(255,255,255,0.06);
  --accent:#00e5ff;
  --gold:#ffd700;
  --text:#ffffff;
  --muted:#8aa0b4;
}

*{box-sizing:border-box;font-family:Montserrat,sans-serif}
body{
  margin:0;
  background:radial-gradient(circle at top,#14213d,#05070d);
  color:var(--text);
  overflow:hidden;
}

/* Layout */
.app{
  display:grid;
  grid-template-columns:280px 1fr 320px;
  height:100vh;
}

/* Panels */
.panel{
  background:var(--glass);
  backdrop-filter:blur(12px);
  border-right:1px solid rgba(255,255,255,0.08);
  padding:10px;
  overflow-y:auto;
}

.right{
  border-right:none;
  border-left:1px solid rgba(255,255,255,0.08);
}

/* Center preview */
.center{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:10px;
}

canvas{
  width:360px;
  height:640px;
  border-radius:18px;
  background:#000;
  box-shadow:0 0 40px rgba(0,229,255,0.2);
}

/* Inputs */
input, select, button{
  width:100%;
  padding:10px;
  margin:6px 0;
  border:none;
  border-radius:8px;
  background:#1c2740;
  color:white;
}

button{
  cursor:pointer;
  background:linear-gradient(45deg,#00e5ff,#3a7bd5);
  font-weight:600;
}

button:hover{transform:scale(1.02)}

/* Labels */
h3{margin:10px 0 5px}
.small{font-size:12px;color:var(--muted)}

/* Badges */
.badge{
  padding:4px 8px;
  border-radius:6px;
  font-size:11px;
  background:var(--accent);
  display:inline-block;
}

/* Timeline */
.timeline{
  height:80px;
  background:#0f1626;
  border-radius:10px;
  margin-top:10px;
  position:relative;
  overflow:hidden;
}

.scene-bar{
  position:absolute;
  height:100%;
  width:16.6%;
  border-right:1px solid rgba(255,255,255,0.1);
}

/* particles */
.particle{
  position:absolute;
  width:4px;height:4px;
  background:white;
  border-radius:50%;
  opacity:0.8;
}

</style>
</head>

<body>

<div class="app">

<!-- LEFT PANEL -->
<div class="panel">
  <h3>🎮 Team Setup</h3>

  <input id="teamA" placeholder="Team A Name"/>
  <input id="teamB" placeholder="Team B Name"/>

  <label class="small">Team A Logo</label>
  <input type="file" id="logoA" accept="image/*"/>

  <label class="small">Team B Logo</label>
  <input type="file" id="logoB" accept="image/*"/>

  <button onclick="generatePrediction()">⚡ Generate AI Prediction</button>

  <h3>🎯 AI Result</h3>
  <div id="resultBox" class="small">No prediction yet</div>

  <h3>🎬 Controls</h3>
  <button onclick="play()">▶ Play</button>
  <button onclick="pause()">⏸ Pause</button>
  <button onclick="reset()">🔄 Reset</button>

  <h3>🔥 Viral Mode</h3>
  <button onclick="toggleViral()">Toggle Viral Mode</button>

  <div class="small">Makes animations more intense</div>
</div>

<!-- CENTER PREVIEW -->
<div class="center">
  <canvas id="canvas" width="1080" height="1920"></canvas>

  <div class="timeline">
    <div class="scene-bar"></div>
  </div>
</div>

<!-- RIGHT PANEL -->
<div class="panel right">
  <h3>🎨 Templates</h3>
  <select id="template">
    <option>UEFA Style</option>
    <option>World Cup</option>
    <option>Premier League</option>
    <option>Cyber Neon</option>
    <option>Fire Arena</option>
  </select>

  <h3>📤 Export</h3>
  <button onclick="downloadPNG()">Download PNG</button>
  <button onclick="saveJSON()">Save Project</button>
  <input type="file" onchange="loadJSON(event)"/>

  <h3>📊 Score Generator</h3>
  <button onclick="generateScore()">Generate Score</button>
  <div id="scoreBox">--</div>
</div>

</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let state = {
  teamA:"Team A",
  teamB:"Team B",
  logoA:null,
  logoB:null,
  pred:null,
  viral:false,
  running:false,
  t:0,
  particles:[]
};

/* ---------------- LOGO LOAD ---------------- */
document.getElementById("logoA").onchange=e=>{
  const r=new FileReader();
  r.onload=ev=>state.logoA=ev.target.result;
  r.readAsDataURL(e.target.files[0]);
};

document.getElementById("logoB").onchange=e=>{
  const r=new FileReader();
  r.onload=ev=>state.logoB=ev.target.result;
  r.readAsDataURL(e.target.files[0]);
};

/* ---------------- PREDICTION ENGINE ---------------- */
function generatePrediction(){
  let home = rand(45,70);
  let draw = rand(10,30);
  let away = rand(10,45);

  let sum = home+draw+away;
  home = Math.round(home/sum*100);
  draw = Math.round(draw/sum*100);
  away = 100-home-draw;

  let winner = "DRAW";
  if(home>draw && home>away) winner = state.teamA;
  if(away>home && away>draw) winner = state.teamB;

  state.pred = {home,draw,away,winner};

  document.getElementById("resultBox").innerHTML =
  `${state.teamA}: ${home}%<br>Draw: ${draw}%<br>${state.teamB}: ${away}%<br><b>Winner: ${winner}</b>`;
}

/* ---------------- SCORE ---------------- */
function generateScore(){
  const a = rand(0,3);
  const b = rand(0,3);
  document.getElementById("scoreBox").innerText = `${a} - ${b}`;
}

/* ---------------- DRAW SCENE ---------------- */
function draw(){
  ctx.clearRect(0,0,1080,1920);

  // background
  let grad = ctx.createLinearGradient(0,0,0,1920);
  grad.addColorStop(0,"#0a0f1f");
  grad.addColorStop(1,"#05070d");
  ctx.fillStyle=grad;
  ctx.fillRect(0,0,1080,1920);

  if(state.pred){

    // Title
    ctx.fillStyle="#00e5ff";
    ctx.font="80px Montserrat";
    ctx.fillText("AI PREDICTION",200,200);

    // Teams
    ctx.fillStyle="white";
    ctx.font="60px Montserrat";
    ctx.fillText(state.teamA,120,400);
    ctx.fillText(state.teamB,120,900);

    // Bars
    bar(400,state.pred.home,"#00e5ff");
    bar(700,state.pred.draw,"#ffd700");
    bar(1000,state.pred.away,"#ff3b3b");

    // Winner
    ctx.fillStyle="#ffd700";
    ctx.font="90px Montserrat";
    ctx.fillText("WINNER",300,1400);

    ctx.fillStyle="white";
    ctx.fillText(state.pred.winner,200,1550);

    if(state.viral) spawnParticles();
    updateParticles();
  }
}

function bar(y,val,color){
  ctx.fillStyle="#1c2740";
  ctx.fillRect(200,y,600,40);
  ctx.fillStyle=color;
  ctx.fillRect(200,y,6*val,40);
}

/* ---------------- PARTICLES ---------------- */
function spawnParticles(){
  if(state.particles.length<80){
    state.particles.push({
      x:Math.random()*1080,
      y:0,
      s:Math.random()*4+2,
      v:Math.random()*4+2
    });
  }
}

function updateParticles(){
  ctx.fillStyle="white";
  state.particles.forEach(p=>{
    p.y+=p.v;
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.s,0,Math.PI*2);
    ctx.fill();
  });
  state.particles = state.particles.filter(p=>p.y<1920);
}

/* ---------------- LOOP ---------------- */
function loop(){
  if(state.running){
    draw();
    state.t++;
  }
  requestAnimationFrame(loop);
}
loop();

/* ---------------- CONTROL ---------------- */
function play(){state.running=true;}
function pause(){state.running=false;}
function reset(){state.running=false;state.pred=null;}

/* ---------------- VIRAL ---------------- */
function toggleViral(){
  state.viral=!state.viral;
  alert("Viral Mode: "+state.viral);
}

/* ---------------- EXPORT ---------------- */
function downloadPNG(){
  const link=document.createElement("a");
  link.download="prediction.png";
  link.href=canvas.toDataURL();
  link.click();
}

/* ---------------- SAVE LOAD ---------------- */
function saveJSON(){
  const blob=new Blob([JSON.stringify(state)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="project.json";
  a.click();
}

function loadJSON(e){
  const r=new FileReader();
  r.onload=ev=>state=JSON.parse(ev.target.result);
  r.readAsText(e.target.files[0]);
}

/* ---------------- UTILS ---------------- */
function rand(min,max){
  return Math.floor(Math.random()*(max-min+1))+min;
}
</script>

</body>
</html>

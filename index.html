<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Supercomputer Football Predictor 1080p</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #050811;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }
        
        /* 9:16 Tik Tok / Reels Container Layout */
        #viewportContainer {
            position: relative;
            width: 100%;
            max-width: 450px;
            height: 100vh;
            max-height: 800px;
            background: radial-gradient(circle at center, #0a1128 0%, #02040a 100%);
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding-bottom: 20px;
            border: 1px solid rgba(0, 242, 254, 0.15);
        }

        /* Sci-Fi Grid Line Animation Overlay */
        #viewportContainer::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(rgba(0, 242, 254, 0.03) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(0, 242, 254, 0.03) 1px, transparent 1px);
            background-size: 20px 20px;
            pointer-events: none;
        }

        /* Top HUD Scoreboard Header */
        .hud-header {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 35px;
            z-index: 5;
        }
        .hud-title {
            color: #00f2fe;
            font-size: 10px;
            font-weight: bold;
            letter-spacing: 3px;
            margin-bottom: 10px;
            text-transform: uppercase;
            text-shadow: 0 0 8px rgba(0, 242, 254, 0.6);
        }
        .match-score-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            background: rgba(2, 6, 18, 0.75);
            padding: 8px 22px;
            border-radius: 4px;
            border: 1px solid rgba(0, 242, 254, 0.3);
            box-shadow: inset 0 0 15px rgba(0, 242, 254, 0.1);
        }
        .team-flag {
            width: 36px;
            height: 24px;
            background-color: #111;
            border: 1px solid rgba(255,255,255,0.3);
            object-fit: cover;
            border-radius: 2px;
        }
        .score-nums {
            color: #ffffff;
            font-size: 32px;
            font-weight: 900;
            font-family: monospace;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255,255,255,0.3);
        }
        .hud-timer {
            color: #00f2fe;
            font-size: 26px;
            margin-top: 10px;
            font-weight: bold;
            font-family: monospace;
            text-shadow: 0 0 6px rgba(0, 242, 254, 0.5);
        }

        /* Center Canvas Simulation Board */
        canvas {
            width: 100%;
            height: 400px;
            display: block;
        }

        /* 🛠️ Modern Neon Control Panel */
        .neon-control-card {
            background: rgba(2, 4, 10, 0.9);
            width: 92%;
            margin: 0 auto;
            border-radius: 16px;
            padding: 16px;
            color: white;
            border: 1px solid rgba(0, 242, 254, 0.2);
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            z-index: 10;
        }
        .config-row {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 15px;
        }
        .input-group {
            flex: 1;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 8px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        .input-group input[type="text"] {
            width: 100%;
            background: #070c18;
            border: 1px solid rgba(0, 242, 254, 0.3);
            color: #fff;
            padding: 6px;
            border-radius: 6px;
            text-align: center;
            font-size: 13px;
            font-weight: bold;
            outline: none;
        }
        .input-group input[type="text"]:focus {
            border-color: #00f2fe;
            box-shadow: 0 0 8px rgba(0, 242, 254, 0.4);
        }
        .neon-upload {
            background: rgba(0, 242, 254, 0.05);
            color: #00f2fe;
            font-size: 10px;
            font-weight: bold;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
            width: 100%;
            border: 1px dashed rgba(0, 242, 254, 0.4);
            text-transform: uppercase;
        }
        .neon-upload input[type="file"] {
            display: none;
        }
        .action-btn {
            width: 100%;
            background: linear-gradient(45deg, #00f2fe, #4facfe);
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            letter-spacing: 1px;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.4);
            transition: 0.3s;
        }
        .action-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(0, 242, 254, 0.6);
        }
    </style>
</head>
<body>

<div id="viewportContainer">
    <div class="hud-header">
        <div class="hud-title">AI Supercomputer Match Prediction</div>
        <div class="match-score-row">
            <img id="flagL" class="team-flag" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" style="background-color: #00f2fe;">
            <div class="score-nums" id="hudScore">0 - 0</div>
            <img id="flagR" class="team-flag" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" style="background-color: #ff007f;">
        </div>
        <div class="hud-timer" id="hudTime">00:00</div>
    </div>

    <canvas id="simulationCanvas"></canvas>

    <div class="neon-control-card">
        <div class="config-row">
            <div class="input-group">
                <input type="text" id="name1" value="TEAM A">
                <label class="neon-upload">
                    📷 Upload Logo
                    <input type="file" id="file1" accept="image/*">
                </label>
            </div>
            <div class="input-group">
                <input type="text" id="name2" value="TEAM B">
                <label class="neon-upload">
                    📷 Upload Logo
                    <input type="file" id="file2" accept="image/*">
                </label>
            </div>
        </div>
        <button class="action-btn" id="triggerBtn">Record & Start Predict</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('simulationCanvas');
    const ctx = canvas.getContext('2d');

    // ⭐ High Definition 1080p Internal Resolution Setup (ဗီဒီယိုကြည်လင်ပြတ်သားရန်)
    const renderWidth = 1080;
    const renderHeight = 960; 
    canvas.width = renderWidth;
    canvas.height = renderHeight;

    const center = { x: renderWidth / 2, y: renderHeight / 2 };
    const fieldRadius = 360; // 1080p အချိုးကျ စက်ဝိုင်းကြီးအောင် ချဲ့ထားသည်

    let score = { team1: 0, team2: 0 };
    let isLive = false;
    
    // ⏱️ ၁၅ စက္ကန့် စနစ်တည်ဆောက်မှု (15 Seconds Real time = 90 Minutes Match time)
    let virtualMins = 0;
    let virtualSecs = 0;
    let lastClockTick = 0;
    const simulationDuration = 15; // စက္ကန့် ၁၅ စက္ကန့်ကွက်တိ ကစားပါမည်

    // 🥅 ဗီဒီယိုအတိုင်း အဆက်မပြတ်လည်ပတ်နေသော ဂိုးပေါက်စနစ်
    let goalAngle = -Math.PI / 2;
    const goalSpeed = 0.015; // လည်ပတ်နှုန်း အရှိန်
    const goalWidthAngle = 0.28; // ဂိုးသွင်းရခက်အောင် ကျဉ်းကျဉ်းနှင့် စိတ်လှုပ်ရှားဖွရာ သတ်မှတ်ထားသည်

    const balls = [
        { id: 'team1', name: 'TEAM A', x: center.x - 90, y: center.y + 40, vx: -12, vy: 14, radius: 48, img: null, isGoalOut: false, color: '#00f2fe' },
        { id: 'team2', name: 'TEAM B', x: center.x + 90, y: center.y - 40, vx: 14, vy: -12, radius: 48, img: null, isGoalOut: false, color: '#ff007f' }
    ];

    // 🎥 Video Recorder Variables
    let mediaRecorder;
    let recordedChunks = [];

    // 🔊 Web Audio API
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playTickSound() {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(500, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.03);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.03);
    }

    function playGoalSound() {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const bufferSize = audioCtx.sampleRate * 1.5;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1;
        }
        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(380, audioCtx.currentTime);
        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.005, audioCtx.currentTime + 1.4);
        noise.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);
        noise.start();
    }

    function resetBall(ball) {
        ball.x = center.x + (Math.random() * 40 - 20);
        ball.y = center.y + (Math.random() * 40 - 20);
        ball.vx = (Math.random() > 0.5 ? 1 : -1) * (11 + Math.random() * 5);
        ball.vy = (Math.random() > 0.5 ? 1 : -1) * (11 + Math.random() * 5);
        ball.isGoalOut = false;
    }

    // ⚙️ Core Physics Engine Loop
    function update() {
        // ဂိုးပေါက်ကို ဗီဒီယိုအတိုင်း အဆက်မပြတ် လည်ပတ်စေခြင်း
        goalAngle += goalSpeed;
        if (goalAngle > Math.PI * 2) goalAngle -= Math.PI * 2;

        if (!isLive) return;

        // ⏱️ ၁၅ စက္ကန့်အတွင်း မိနစ် ၉၀ အမြန်ဆုံးဖြတ်စနစ်
        let now = Date.now();
        if (now - lastClockTick >= (simulationDuration * 1000 / 5400)) {
            virtualSecs++;
            if (virtualSecs >= 60) {
                virtualSecs = 0;
                virtualMins++;
            }
            lastClockTick = now;

            if (virtualMins >= 90) {
                virtualMins = 90; virtualSecs = 0;
                isLive = false;
                stopRecordingAndDownload();
            }
            
            document.getElementById('hudTime').innerText = `${virtualMins.toString().padStart(2, '0')}:${virtualSecs.toString().padStart(2, '0')}`;
        }

        balls.forEach(ball => {
            if (ball.isGoalOut) {
                ball.x += ball.vx;
                ball.y += ball.vy;
                if (ball.x < -100 || ball.x > renderWidth + 100 || ball.y < -100 || ball.y > renderHeight + 100) {
                    resetBall(ball);
                }
                return;
            }

            ball.x += ball.vx;
            ball.y += ball.vy;

            let dx = ball.x - center.x;
            let dy = ball.y - center.y;
            let distance = Math.sqrt(dx * dx + dy * dy);

            if (distance + ball.radius >= fieldRadius) {
                let ballAngle = Math.atan2(dy, dx);
                if (ballAngle < 0) ballAngle += Math.PI * 2;

                let angleDiff = Math.abs(ballAngle - goalAngle);
                if (angleDiff > Math.PI) angleDiff = Math.PI * 2 - angleDiff;

                // ဂိုးဝင်ခြင်း ရှိ/မရှိ စစ်ဆေးခြင်း
                if (angleDiff < goalWidthAngle / 2) {
                    ball.isGoalOut = true;
                    playGoalSound();
                    if (ball.id === 'team1') score.team1++;
                    else score.team2++;
                    document.getElementById('hudScore').innerText = `${score.team1} - ${score.team2}`;
                } else {
                    // တိကျသော Elastic Collision + Chaos Factor
                    let nx = dx / distance;
                    let ny = dy / distance;

                    ball.x = center.x + nx * (fieldRadius - ball.radius);
                    ball.y = center.y + ny * (fieldRadius - ball.radius);

                    let dotProduct = ball.vx * nx + ball.vy * ny;
                    let deviation = (Math.random() - 0.5) * 0.5; // လမ်းကြောင်းလွှဲမှုစနစ်

                    ball.vx = (ball.vx - 2 * dotProduct * nx) + deviation;
                    ball.vy = (ball.vy - 2 * dotProduct * ny) + deviation;

                    // Speed Limits Control
                    let currentSpeed = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);
                    if (currentSpeed > 22) { ball.vx *= (18/currentSpeed); ball.vy *= (18/currentSpeed); }
                    if (currentSpeed < 12) { ball.vx *= (14/currentSpeed); ball.vy *= (14/currentSpeed); }

                    playTickSound();
                }
            }
        });

        // ဘောလုံးအချင်းချင်း တိုက်မိခြင်း
        for (let i = 0; i < balls.length; i++) {
            for (let j = i + 1; j < balls.length; j++) {
                let b1 = balls[i]; let b2 = balls[j];
                if (b1.isGoalOut || b2.isGoalOut) continue;

                let dx = b2.x - b1.x; let dy = b2.y - b1.y;
                let dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < b1.radius + b2.radius) {
                    let overlap = (b1.radius + b2.radius) - dist;
                    let nx = dx / dist; let ny = dy / dist;

                    b1.x -= nx * overlap / 2; b1.y -= ny * overlap / 2;
                    b2.x += nx * overlap / 2; b2.y += ny * overlap / 2;

                    let kx = b1.vx - b2.vx; let ky = b1.vy - b2.vy;
                    let p = nx * kx + ny * ky;

                    b1.vx -= p * nx; b1.vy -= p * ny;
                    b2.vx += p * nx; b2.vy += p * ny;
                    playTickSound();
                }
            }
        }
    }

    // 🎨 Sci-Fi High Tech Visual Rendering Module
    function draw() {
        ctx.clearRect(0, 0, renderWidth, renderHeight);

        // Cyberpunk Glowing Ring Base
        ctx.shadowBlur = 25;
        ctx.shadowColor = '#00f2fe';
        ctx.beginPath();
        ctx.arc(center.x, center.y, fieldRadius, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(0, 242, 254, 0.8)';
        ctx.lineWidth = 12;
        ctx.stroke();
        ctx.shadowBlur = 0; // Reset Shadow

        // 🥅 မျက်စိပသာဒဖြစ်စေမည့် တောက်ပသော လည်ပတ်ဂိုးပေါက်ဆွဲခြင်း
        ctx.save();
        ctx.translate(center.x, center.y);
        ctx.rotate(goalAngle);
        
        ctx.shadowBlur = 30;
        ctx.shadowColor = '#ffffff';
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 10;
        ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
        
        ctx.beginPath();
        ctx.arc(0, 0, fieldRadius + 50, -goalWidthAngle/2, goalWidthAngle/2);
        let endX = Math.cos(goalWidthAngle/2) * fieldRadius;
        let endY = Math.sin(goalWidthAngle/2) * fieldRadius;
        ctx.lineTo(endX, endY);
        ctx.arc(0, 0, fieldRadius, goalWidthAngle/2, -goalWidthAngle/2, true);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.restore();
        ctx.shadowBlur = 0;

        // ဘောလုံး/အလံပုံရိပ်များ ဖော်ထုတ်ခြင်း
        balls.forEach(ball => {
            ctx.save();
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.clip();
            
            if (ball.img) {
                ctx.drawImage(ball.img, ball.x - ball.radius, ball.y - ball.radius, ball.radius * 2, ball.radius * 2);
            } else {
                ctx.fillStyle = ball.color;
                ctx.fill();
            }
            
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 4;
            ctx.stroke();
            ctx.restore();
        });
    }

    function mainEngineLoop() {
        update();
        draw();
        requestAnimationFrame(mainEngineLoop);
    }

    // 🎥 1080p Video Capturer Engine (ဒေါင်းလုဒ်လုပ်ရန် စနစ်)
    function startRecording() {
        recordedChunks = [];
        const stream = canvas.captureStream(60); // 60 FPS HD Quality
        mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9', videoBitsPerSecond: 8000000 }); // High Bitrate
        
        mediaRecorder.ondataavailable = (e) => {
            if (e.data.size > 0) recordedChunks.push(e.data);
        };

        mediaRecorder.onstop = () => {
            const blob = new Blob(recordedChunks, { type: 'video/webm' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Match_Prediction_${balls[0].name}_vs_${balls[1].name}.webm`;
            a.click();
            
            // UI Finish State
            let winner = "DRAW CONCLUDED";
            if (score.team1 > score.team2) winner = `${balls[0].name} PREDICTED WINNER`;
            else if (score.team2 > score.team1) winner = `${balls[1].name} PREDICTED WINNER`;
            document.getElementById('cardMain').innerText = winner;
            document.getElementById('triggerBtn').innerText = "PREDICTION FINISHED";
            document.getElementById('triggerBtn').style.background = "#222";
        };

        mediaRecorder.start();
    }

    function stopRecordingAndDownload() {
        if (mediaRecorder && mediaRecorder.state !== 'inactive') {
            mediaRecorder.stop();
        }
    }

    // 🕹️ UI Logic Synchronization
    document.getElementById('name1').addEventListener('input', (e) => { balls[0].name = e.target.value.toUpperCase() || 'TEAM A'; });
    document.getElementById('name2').addEventListener('input', (e) => { balls[1].name = e.target.value.toUpperCase() || 'TEAM B'; });

    function syncLogoUploader(inputId, ballIdx, flagId) {
        document.getElementById(inputId).addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    const img = new Image();
                    img.src = evt.target.result;
                    img.onload = () => { 
                        balls[ballIdx].img = img; 
                        document.getElementById(flagId).src = evt.target.result;
                    };
                };
                reader.readAsDataURL(file);
            }
        });
    }
    syncLogoUploader('file1', 0, 'flagL');
    syncLogoUploader('file2', 1, 'flagR');

    // Button Click Trigger Action
    const triggerBtn = document.getElementById('triggerBtn');
    triggerBtn.addEventListener('click', () => {
        if (virtualMins >= 90 || isLive) return;
        
        if (audioCtx.state === 'suspended') audioCtx.resume();
        
        isLive = true;
        lastClockTick = Date.now();
        triggerBtn.innerText = "RECORDING LIVE SIMULATION...";
        triggerBtn.style.background = "linear-gradient(45deg, #ff007f, #ff0055)";
        triggerBtn.style.color = "#fff";
        
        startRecording(); // ဗီဒီယိုဖမ်းယူခြင်း စတင်မည်
    });

    // Start Engine
    mainEngineLoop();
</script>

</body>
</html>
